  - name: growth_h3_r9
    source: YOUR_PROJECT.YOUR_DATASET.growth_h3_r9
    primary_key:
    - h3
    ai_context:
      synonyms:
      - growth cells
      - H3 cells
      - hexagons
      - growth grid
      - cells
      - neighbourhoods
      instructions: 'GRAIN: one row per H3 resolution-9 cell (about 0.1 km2) - 459 cells covering the study area.
        Cells with fewer than 5 parcels are excluded, so the cells do not tile the area completely. Classify cells
        with the growth_class, risk_class and quadrant fields (see CELL CLASSIFICATION in the model instructions);
        sum only the raw counts (total_parcels, growth_parcels, crs_parcels), never the k1_* columns.'
    fields:
    - name: h3
      label: Cell
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: h3
      description: H3 cell index at resolution 9 - the join key to portfolio_risk.h3 and growth_parcels.h3.
      ai_context:
        synonyms:
        - cell
        - hexagon
        - h3 index
      custom_extensions:
      - vendor_name: CARTO
        data: '{"spatial_data": {"type": "spatial_index", "spatial_index": {"system": "h3", "resolution": 9, "hierarchy":
          {"parent": 8, "children": [10]}}}}'
    - name: geom
      label: Geometry
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: geom
      description: Cell boundary polygon (WGS84). Use it to draw or colour cells on the map.
      ai_context:
        synonyms:
        - cell boundary
      custom_extensions:
      - vendor_name: CARTO
        data: '{"spatial_data": {"type": "polygon", "srid": 4326}}'
    - name: total_parcels
      label: Counts
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: total_parcels
      description: 'Parcels whose centroid falls in the cell. Additive: SUM across cells.'
      ai_context:
        synonyms:
        - parcels
        - parcel count
    - name: growth_parcels
      label: Counts
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: growth_parcels
      description: 'Parcels in the cell flagged as growth (any growth stage). Additive: SUM across cells. Equals
        the number of growth_parcels rows with this h3.'
      ai_context:
        synonyms:
        - growth count
        - new development count
    - name: growth_share
      label: Growth
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: growth_share
      description: growth_parcels / total_parcels for the cell alone. Too noisy to classify cells (about 2 growth
        parcels per cell); use k1_growth_share. Not additive.
    - name: crs_parcels
      label: Counts
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: crs_parcels
      description: Parcels in the cell with a Parcel Essentials composite risk score (crs). Additive.
    - name: crs_median
      label: Risk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: crs_median
      description: Median crs (composite risk score, 1-100) of the cell's parcels. Not additive.
    - name: k1_total_parcels
      label: Smoothed
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: k1_total_parcels
      description: 'Parcels in the cell and its 6 neighbours. Overlaps neighbouring cells: never SUM.'
    - name: k1_growth_parcels
      label: Smoothed
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: k1_growth_parcels
      description: 'Growth parcels in the cell and its 6 neighbours. Overlaps neighbouring cells: never SUM.'
    - name: k1_growth_share
      label: Smoothed
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: k1_growth_share
      description: k1_growth_parcels / k1_total_parcels - the smoothed growth share that defines the growth class
        (high when > 0.013).
      ai_context:
        synonyms:
        - growth share
        - growth rate
        - growth intensity
    - name: k1_crs_median
      label: Smoothed
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: k1_crs_median
      description: Median crs over the cell and its 6 neighbours - the cell's risk level, which defines the risk
        class (high when >= 61). NULL in 4 cells.
      ai_context:
        synonyms:
        - cell risk
        - neighbourhood risk
        - area risk
    - name: growth_class
      label: Classification
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CASE WHEN k1_growth_share > 0.013 THEN 'High growth' ELSE 'Low growth' END
      description: '''High growth'' when k1_growth_share > 0.013 (the study-area median), else ''Low growth''.'
      ai_context:
        synonyms:
        - high growth
        - low growth
        - growth level
    - name: risk_class
      label: Classification
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CASE WHEN k1_crs_median IS NULL THEN 'Unclassified' WHEN k1_crs_median >= 61 THEN 'High risk'
            ELSE 'Low risk' END
      description: '''High risk'' when k1_crs_median >= 61 (the study-area median), ''Low risk'' below it, ''Unclassified''
        when k1_crs_median is NULL (4 cells).'
      ai_context:
        synonyms:
        - high risk
        - low risk
        - risk level
    - name: quadrant
      label: Classification
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CASE WHEN k1_crs_median IS NULL THEN 'Unclassified' WHEN k1_growth_share > 0.013 AND k1_crs_median
            >= 61 THEN 'Watchlist' WHEN k1_growth_share > 0.013 THEN 'Pursue' WHEN k1_crs_median >= 61 THEN 'Reassess'
            ELSE 'Hold' END
      description: 'Growth x risk quadrant: Pursue (high growth, low risk), Watchlist (high growth, high risk),
        Hold (low growth, low risk), Reassess (low growth, high risk), or Unclassified. Cells: Pursue 62, Watchlist
        158, Hold 158, Reassess 77, Unclassified 4.'
      ai_context:
        synonyms:
        - 2x2
        - segment
        - action
        - category
        - watchlist
        - pursue
        - hold
        - reassess
  - name: growth_parcels
    source: YOUR_PROJECT.YOUR_DATASET.growth_parcels
    primary_key:
    - clip
    ai_context:
      instructions: |
        GRAIN: one row per property in a growth stage - 918 rows; clip (the CLIP, a 10-digit STRING; puid in the production view) is unique and never NULL. Every row has a growth_stage, so properties with no growth activity are not in this table - "share of all properties" questions need parcel_essentials as the denominator. Location columns: tract_geoid, h3 (the H3 resolution-9 cell of the parcel centroid, the key to growth_h3_r9) and geom (the parcel centroid point).
        SNAPSHOT: the rows are the production growth release built 2026-10-11 for this area, unchanged, and the table is not refreshed. "Recent" and "past two years" are relative to that release, not to today.
        GROWTH STAGE: growth_stage is 'Early Growth', 'Ongoing Growth' or 'Recently Completed' (not 'Recently Completed Growth'). Verified 2026-10-14: every Ongoing Growth row has recent_new_con_bldg_permit_indicator = 'Y' and no new-construction sale or recent year built; Early Growth rows have none of those three, and each has at least one of landuse_change_indicator, builder_developer_ownership_indicator or new_clip_indicator = 'Y'; the new-construction sale and recent year built flags occur only on Recently Completed rows, and every Recently Completed row has at least one of them.
        TYPE OF GROWTH: compare with TRIM(type_of_growth) - the multi-family value is stored as 'Multi-Family ' with a trailing space.
        FLAGS: the Y/N indicators use different encodings. recent_new_construction_sale_indicator is 'Y' or NULL only; recent_yearbuilt_indicator is always 'Y' or 'N'; the others are 'Y', 'N' or NULL. NULL means not indicated, so for the negative case use COALESCE(<flag>, 'N') = 'N' and say "not indicated" rather than "no".
        RECENT WINDOW: "recent" means the past two years. Permit effective dates run from 20241016 to 20260922 in this table, and year_built is 2024 wherever it is populated. Dates are YYYYMMDD integers: PARSE_DATE('%Y%m%d', CAST(recent_new_con_bldg_permit_effective_date AS STRING)).
        NEARBY COUNTS: the *_cnt columns count OTHER properties within two miles that carry the flag. They were computed on the full production data, so they include neighbours that are not in this table or the study area and cannot be reproduced by counting rows here. They describe the neighbourhood, overlap between neighbours, and must never be summed across properties - use AVG or MAX on one row per clip. NULL means not computed, not zero; each field says where it is populated.
        UNPOPULATED COLUMNS: anticipated_early_growth_score, anticipated_construction_score, anticipated_construction_completed_score, pre_growth_stage_indicator, ownership_classification, builder_developer_type_code, date_of_last_growth_stage_change and parcel_link_status are NULL on every row of this table (verified 2026-10-14). Never filter or group on them; if asked, say the field is not populated.
        UNDOCUMENTED COLUMNS: addr_vacant_ratio, count_year_built and count_eff_year_built are not in the product data dictionary; say their meaning is unconfirmed if you use them.
      synonyms:
      - growth intelligence
      - growth indicators
      - parcel growth
      - property growth indicators
      - development activity
      - growth study
      - growth parcels
      - new development
    fields:
    - name: clip
      label: Identification
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: clip
      description: 'Property identifier: the Cotality CLIP as a 10-digit string. Named puid (INT64) in the production
        view; renamed and converted to STRING for this table, with no leading zeros lost (every value is 10 digits,
        as in parcel_essentials). Unique and never NULL - one row per property, 918 rows. Join to parcel_essentials
        with p.clip = g.clip (no CAST); all 918 match a parcel_essentials clip (verified 2026-10-14), and one of
        them (5167985792) spans two parcel shapes.'
      ai_context:
        synonyms:
        - puid
        - cotality property id
        - growth property id
        instructions: 'BigQuery type: STRING. Identifier column (primary key).'
    - name: tract_geoid
      label: Identification
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: tract_geoid
      description: Full 11-digit 2020 Census tract GEOID of the property (2-digit state + 3-digit county + 6-digit
        tract), e.g. '12071050318'. Added to this study extract; not in the production growth view. Never NULL;
        one value per property. Seven of the eight study tracts occur - '12071050318' (364 rows), '12071050401'
        (286), '12071050601' (110), '12071050317' (66), '12071050603' (61), '12071050502' (29), '12071050316' (2);
        '12071050315' has no growth property. Agrees with parcel_essentials tract_geoid for all 918 properties;
        clip 5167985792, whose two parcel shapes lie in tracts 12071050401 and 12071050502, holds '12071050502'.
        Use it for tract filters and per-tract counts without the join.
      ai_context:
        synonyms:
        - growth property tract
        - growth tract
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: property_linkage_id
      label: Identification
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: propertylinkageid
      description: Internal property linkage key. Unique in this table (918 values, never NULL), but it is not a
        CLIP and matches no parcel_essentials key - never use it for joins.
      ai_context:
        instructions: 'BigQuery type: INT64.'
    - name: recent_new_construction_sale_indicator
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: recent_new_construction_sale_indicator
      description: Most recent sale was within the past two years and identified as a new construction sale. Only
        'Y' or NULL occur - there is no 'N' value, so use IS NULL (stated as 'not indicated') for the negative case.
      ai_context:
        synonyms:
        - new construction sale
        instructions: 'BigQuery type: STRING. Flag column. Values (2026-10-14): yes: ''Y'' (204 rows); not indicated:
          NULL (714 rows).'
    - name: recent_nearby_new_construction_count
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: recent_nearby_new_construction_cnt
      description: Count of other properties within two miles with the New Construction Property Indicator set to
        Y.
      ai_context:
        synonyms:
        - nearby new construction
        instructions: 'BigQuery type: INT64. Numeric measure, unit: count. Neighbourhood count of OTHER properties
          within two miles; never SUM it across properties (the radii overlap) - use AVG or MAX on one row per clip.
          NULL means not computed, not zero. Populated on 204 rows - exactly the rows with recent_new_construction_sale_indicator
          = ''Y'' - from 55 to 207 (median 165); computed on the full production data, so it counts neighbours outside
          this table.'
    - name: land_use_change_indicator
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: landuse_change_indicator
      description: Land use for the property has changed in the past two years.
      ai_context:
        synonyms:
        - land use change
        instructions: 'BigQuery type: STRING. Flag column. Values (2026-10-14): yes: ''Y'' (131 rows); no: ''N''
          (161 rows); not indicated: NULL (626 rows).'
    - name: land_use_change_indicator_count
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: landuse_change_cnt
      description: Count of other properties within two miles with the Land Use Change Indicator set to Y.
      ai_context:
        synonyms:
        - nearby land use change
        instructions: 'BigQuery type: INT64. Numeric measure, unit: count. Neighbourhood count of OTHER properties
          within two miles; never SUM it across properties (the radii overlap) - use AVG or MAX on one row per clip.
          NULL means not computed, not zero. Populated on 292 rows - exactly where land_use_change_indicator is
          ''Y'' or ''N'' - from 516 to 1,431 (median 1,140); computed on the full production data, so it counts
          neighbours outside this table (only 131 rows here have the flag).'
    - name: previous_land_use_code
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: previous_land_use_code
      description: Previous Cotality land use code (the same 3-digit code set as parcel_essentials land_use_code
        / IrisLandUseCd). Populated whenever land_use_change_indicator is 'Y' or 'N' (also on the 'N' rows) and
        NULL otherwise; compare it with p.IrisLandUseCd to show the old and current land use.
      ai_context:
        synonyms:
        - previous land use
        - prior land use
        instructions: 'BigQuery type: STRING. Code column; 13 distinct codes in this table, populated on 292 rows.
          Counts: ''465'' (111 rows), ''100'' (105), ''460'' (20), ''415'' (15), ''420'' (12), ''435'' (4), ''132'',
          ''137'', ''163'' and ''200'' (5 each), ''400'' (3), ''515'' and ''601'' (1 each). Bands as in parcel_essentials
          land_use_code: 100-199 residential, 200-299 commercial, 300-399 industrial, 400-499 vacant land.'
    - name: builder_developer_ownership_indicator
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: builder_developer_ownership_indicator
      description: Set to Y if the owner is identified as a builder or a developer.
      ai_context:
        synonyms:
        - builder owned
        - developer owned
        instructions: 'BigQuery type: STRING. Flag column. Values (2026-10-14): yes: ''Y'' (61 rows); no: ''N''
          (2 rows); not indicated: NULL (855 rows).'
    - name: builder_developer_type_code
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: builder_developer_type_code
      description: Categorizes builder/developer type (multi-family, single family, commercial). Reserved for future
        use.
      ai_context:
        instructions: 'BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter
          or group on it.'
    - name: new_clip_indicator
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: new_clip_indicator
      description: Indicates that the property received a CLIP in the past two years.
      ai_context:
        synonyms:
        - new clip
        - new parcel
        instructions: 'BigQuery type: STRING. Flag column. Values (2026-10-14): yes: ''Y'' (386 rows); no: ''N''
          (138 rows); not indicated: NULL (394 rows).'
    - name: new_clip_count
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: new_clip_cnt
      description: Count of other properties within two miles with the New CLIP Indicator set to Y.
      ai_context:
        synonyms:
        - nearby new clips
        instructions: 'BigQuery type: INT64. Numeric measure, unit: count. Neighbourhood count of OTHER properties
          within two miles; never SUM it across properties (the radii overlap) - use AVG or MAX on one row per clip.
          NULL means not computed, not zero. Populated on 524 rows - exactly where new_clip_indicator is ''Y'' or
          ''N'' - from 13 to 535 (median 453); computed on the full production data, so it counts neighbours outside
          this table.'
    - name: recent_year_built_indicator
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: recent_yearbuilt_indicator
      description: Indicates that the Year Built is less than three years ago. Always 'Y' or 'N', never NULL.
      ai_context:
        synonyms:
        - recently built
        - new build
        instructions: 'BigQuery type: STRING. Flag column. Values (2026-10-14): yes: ''Y'' (244 rows); no: ''N''
          (674 rows).'
    - name: recent_year_built_count
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: recent_yearbuilt_cnt
      description: Count of other properties within two miles with the Recent Year Built Indicator set to Y.
      ai_context:
        synonyms:
        - nearby recently built
        instructions: 'BigQuery type: INT64. Numeric measure, unit: count. Neighbourhood count of OTHER properties
          within two miles; never SUM it across properties (the radii overlap) - use AVG or MAX on one row per clip.
          NULL means not computed, not zero. Populated on 244 rows - exactly the rows with recent_year_built_indicator
          = ''Y'' (NULL on the ''N'' rows) - from 34 to 235 (median 227); computed on the full production data,
          so it counts neighbours outside this table.'
    - name: recent_new_construction_building_permit_indicator
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: recent_new_con_bldg_permit_indicator
      description: A new construction building permit was issued for the property in the past two years.
      ai_context:
        synonyms:
        - building permit
        - new construction permit
        instructions: 'BigQuery type: STRING. Flag column. Values (2026-10-14): yes: ''Y'' (366 rows); no: ''N''
          (71 rows); not indicated: NULL (481 rows).'
    - name: new_construction_building_permit_effective_date
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: recent_new_con_bldg_permit_effective_date
      description: 'Effective date of the new construction building permit as a YYYYMMDD integer. Populated whenever
        the permit indicator is ''Y'' or ''N'' (437 rows - the ''N'' rows carry a date too) and NULL otherwise;
        20241016-20260922 in this table (2024: 106 rows, 2025: 269, 2026: 62). Convert with PARSE_DATE(''%Y%m%d'',
        CAST(recent_new_con_bldg_permit_effective_date AS STRING)).'
      ai_context:
        synonyms:
        - permit date
        instructions: 'BigQuery type: INT64. Date stored as an integer.'
    - name: recent_new_construction_building_permit_count
      label: Growth Indicators
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: recent_new_con_bldg_permit_cnt
      description: Count of other properties within two miles with the Recent New Construction Building Permit Indicator
        set to Y.
      ai_context:
        synonyms:
        - nearby permits
        instructions: 'BigQuery type: INT64. Numeric measure, unit: count. Neighbourhood count of OTHER properties
          within two miles; never SUM it across properties (the radii overlap) - use AVG or MAX on one row per clip.
          NULL means not computed, not zero. Populated on 437 rows - exactly where the permit indicator is ''Y''
          or ''N'' - from 115 to 460 (median 356); computed on the full production data, so it counts neighbours
          outside this table. Values are from the release this table was cut from; the live production view has
          since raised them by 0-3 on most rows.'
    - name: type_of_growth
      label: Stage and Type of Growth
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: type_of_growth
      description: Categorizes current land use into broader growth types. Never NULL. The multi-family value carries
        a trailing space ('Multi-Family '), so compare with TRIM(type_of_growth) = 'Multi-Family' and select TRIM(type_of_growth)
        for display.
      ai_context:
        synonyms:
        - growth type
        - development type
        instructions: 'BigQuery type: STRING. Values (2026-10-14): ''Vacant Land'' (471 rows), ''Single Family Residential''
          (247), ''Multi-Family '' with a trailing space (122), ''Commercial'' (66), ''Other'' (12). The production
          values ''Agricultural'' and ''Transient Residential'' do not occur in this table.'
    - name: stage_of_growth
      label: Stage and Type of Growth
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: growth_stage
      description: Lifecycle stage of the property. Never NULL. Early Growth = evidence of land use change, builder/developer
        ownership or a new CLIP; Ongoing Growth = a recent new construction building permit; Recently Completed
        = a recent new construction sale or a recent year built. The value is 'Recently Completed', not 'Recently
        Completed Growth'.
      ai_context:
        synonyms:
        - growth stage
        - development stage
        instructions: 'BigQuery type: STRING. Values (2026-10-14): ''Recently Completed'' (393 rows), ''Early Growth''
          (307), ''Ongoing Growth'' (218).'
    - name: date_of_last_growth_stage_change
      label: Stage and Type of Growth
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: date_of_last_growth_stage_change
      description: Date when the current growth stage first occurred, as a YYYYMMDD number.
      ai_context:
        instructions: 'BigQuery type: NUMERIC. NULL on every row of this table (verified 2026-10-14) - do not filter
          or group on it.'
    - name: ownership_classification
      label: Stage and Type of Growth
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ownership_classification
      description: Classifies property ownership into categories (e.g. Private, Builder, Developer, Investor, Government).
      ai_context:
        instructions: 'BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter
          or group on it.'
    - name: anticipated_early_growth_score
      label: Growth Stage Confidence Model
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: anticipated_early_growth_score
      description: Predicts if and when a parcel will begin its Early Growth stage from a non-growth state. Scores
        1-5, 5 highest.
      ai_context:
        instructions: 'BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter
          or group on it.'
    - name: anticipated_construction_score
      label: Growth Stage Confidence Model
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: anticipated_construction_score
      description: Predicts if and when a parcel will begin construction (Ongoing Growth) from Early Growth. Scores
        1-5, 5 highest.
      ai_context:
        instructions: 'BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter
          or group on it.'
    - name: anticipated_construction_completed_score
      label: Growth Stage Confidence Model
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: anticipated_construction_completed_score
      description: Predicts if and when a parcel will enter its Completed Property stage from Ongoing Growth. Scores
        1-5, 5 highest.
      ai_context:
        instructions: 'BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter
          or group on it.'
    - name: pre_growth_stage_indicator
      label: Growth Stage Confidence Model
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: pre_growth_stage_indicator
      description: 1 if anticipated_early_growth_score has a value (pre-growth potential), else 0.
      ai_context:
        instructions: 'BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter
          or group on it.'
    - name: address_count
      label: Property Context
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: mailing_address_count
      description: Count of unique addresses associated with the property. 1-353 (median 1); NULL on 64 rows.
      ai_context:
        synonyms:
        - number of addresses
        instructions: 'BigQuery type: INT64. Numeric measure, unit: count.'
    - name: year_built
      label: Property Context
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: year_built
      description: Year of construction. Populated exactly when recent_year_built_indicator = 'Y' (244 rows, every
        one 2024) and NULL otherwise - it is not a general year-built field, and the parcel_essentials fields in
        this model have none.
      ai_context:
        synonyms:
        - year built
        - construction year
        instructions: 'BigQuery type: INT64. Unit: year. Do not SUM.'
    - name: address_vacant_ratio
      label: Property Context
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: addr_vacant_ratio
      description: Not in the product data dictionary. 0 on every populated row of this table (560 rows) and NULL
        on the other 358; the name suggests the share of the property's addresses flagged vacant. Say it is unconfirmed
        if you use it.
      ai_context:
        instructions: 'BigQuery type: FLOAT64. Do not SUM.'
    - name: count_year_built
      label: Property Context
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: count_year_built
      description: Not in the product data dictionary. A count from 0 to 2 (0 on 674 rows), never NULL; it is above
        0 on exactly the 244 rows with recent_year_built_indicator = 'Y'. Say it is unconfirmed if you use it.
      ai_context:
        instructions: 'BigQuery type: INT64.'
    - name: count_effective_year_built
      label: Property Context
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: count_eff_year_built
      description: Not in the product data dictionary. A count from 0 to 2 (0 on 793 rows), never NULL; every row
        above 0 has recent_year_built_indicator = 'Y'. Say it is unconfirmed if you use it.
      ai_context:
        instructions: 'BigQuery type: INT64.'
    - name: parcel_link_status
      label: Property Context
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: parcel_link_status
      description: Parcel link status.
      ai_context:
        instructions: 'BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter
          or group on it.'
    - name: h3
      label: Location
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: h3
      description: H3 resolution-9 cell of the parcel centroid - the join key to growth_h3_r9.h3.
      custom_extensions:
      - vendor_name: CARTO
        data: '{"spatial_data": {"type": "spatial_index", "spatial_index": {"system": "h3", "resolution": 9, "hierarchy":
          {"parent": 8, "children": [10]}}}}'
    - name: geom
      label: Location
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: geom
      description: Parcel centroid point (WGS84). For the parcel polygon, join parcel_essentials on clip.
      custom_extensions:
      - vendor_name: CARTO
        data: '{"spatial_data": {"type": "point", "srid": 4326}}'
  - name: parcel_essentials
    source: YOUR_PROJECT.YOUR_DATASET.parcel_essentials
    primary_key:
    - parcel_shape_id
    - clip
    fields:
    - name: parcel_shape_id
      label: Identification
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: parcel_shape_id
      description: 'Unique and persistent identification number assigned to each parcel polygon. Never NULL. Part
        of this table''s composite grain: (parcel_shape_id, clip) is verified unique; 1,003 of the 15,325 parcels
        (6.5%) carry more than one clip (condo buildings, up to 64 units on one polygon). Count parcels with COUNT(DISTINCT
        parcel_shape_id).'
      ai_context:
        synonyms:
        - parcel id
        - parcel shape identifier
        - polygon id
        instructions: 'BigQuery type: STRING. Identifier column.'
    - name: clip
      label: Identification
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: clip
      description: 'Unique identification number assigned to each property. Part of this table''s composite grain:
        (parcel_shape_id, clip) is verified unique; 50 of the 21,447 clips (0.2%) span more than one parcel (up
        to 34). Never NULL in this table - the study extract holds no parcel-only rows. Count properties with COUNT(DISTINCT
        clip).'
      ai_context:
        synonyms:
        - property id
        - clip id
        - property identifier
        instructions: 'BigQuery type: STRING. Identifier column.'
    - name: state_code
      label: Parcel Information
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: statecode
      description: 'Two-digit state FIPS code from the parcel record. ''12'' (Florida) on every row of this study
        table, so it never narrows a query here; a question about any other state has no rows. Business field name
        in the product spec: STATE CODE.'
      ai_context:
        synonyms:
        - state
        - state fips
        instructions: 'BigQuery type: STRING. Single value in this table: ''12''.'
    - name: county_code
      label: Parcel Information
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: countycode
      description: 'Three-digit county code from the parcel record (statecode + countycode = the parcel''s county).
        ''071'' (Lee County, FL) on every row of this study table and consistent with fips, so it never narrows
        a query here. Business field name in the product spec: COUNTY CODE.'
      ai_context:
        synonyms:
        - county
        - county fips
        instructions: 'BigQuery type: STRING. Single value in this table: ''071''.'
    - name: original_apn
      label: Parcel Information
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: original_apn
      description: Original Assessor's Parcel Number (APN) in the format provided on the assessor tax roll. In Lee
        County this is the STRAP number stored without dashes or dots ('224725B40040I0010'); users usually quote
        the dashed form, which is in PclIdIrisFrmtd ('22-47-25-B4-0040I.0010'), or the 8-digit Folio ID, which is
        in alternate_apn and AcctNbr ('10282351'). Never NULL, identical to apn_parcel_number_unformatted on every
        row, and unique per property within this table. Match a user-supplied APN against original_apn, PclIdIrisFrmtd
        and alternate_apn together.
      ai_context:
        synonyms:
        - apn
        - original parcel number
        - raw apn
        instructions: 'BigQuery type: STRING.'
    - name: alternate_apn
      label: Parcel Information
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: alternate_apn
      description: An alternate ID provided by some counties that can be used to identify a property. In Lee County
        this is the 8-digit Property Appraiser Folio ID (e.g. '10282351'); never NULL here, identical to AcctNbr
        on every row, and unique per property within this table.
      ai_context:
        synonyms:
        - alternate parcel number
        - secondary apn
        instructions: 'BigQuery type: STRING.'
    - name: apn_parcel_number_unformatted
      label: Parcel Information
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: apn_parcel_number_unformatted
      description: Assessor's Parcel Number in an unformatted form. Most often used by the county and others as
        a unique key within that county. In this table it is identical to original_apn on every row (the undashed
        Lee County STRAP number).
      ai_context:
        synonyms:
        - unformatted parcel number
        - assessor parcel number
        instructions: 'BigQuery type: STRING.'
    - name: parcel_address
      label: Parcel Address
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: parcel_address
      description: Original (non-standardized) property street address, as received from the source. Prefer situs_street_address
        for search and display.
      ai_context:
        synonyms:
        - raw address
        - original address
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: parcel_city
      label: Parcel Address
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: city
      description: 'Original USPS city where the parcel is located (non-standardized). Prefer situs_city for search
        and display: here the raw city is BONITA SPRINGS on many rows whose situs_city is ESTERO (raw ESTERO on
        945 rows vs situs ESTERO on 5,126). Business field name in the product spec: PARCEL CITY.'
      ai_context:
        synonyms:
        - raw city
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: parcel_state
      label: Parcel Address
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: state
      description: 'Two-letter USPS state code from the raw parcel address (e.g. ''FL'', not ''12''). ''FL'' on
        every row of this study table and identical to situs_state, so it never narrows a query here. Prefer situs_state
        for display. Business field name in the product spec: PARCEL STATE.'
      ai_context:
        synonyms:
        - raw state
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: parcel_zip
      label: Parcel Address
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: zipcode
      description: 'USPS zip code where the parcel is located (non-standardized, 5-digit). Prefer situs_zip_code
        for search and display. Business field name in the product spec: PARCEL ZIP.'
      ai_context:
        synonyms:
        - raw zip
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: situs_street_address
      label: Parcel Address
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: situs_street_address
      description: Standardized property (situs) street address.
      ai_context:
        synonyms:
        - property address
        - situs address
        - standardized address
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: situs_city
      label: Parcel Address
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: situs_city
      description: 'The standardized city associated with the property address. Values in this study table: BONITA
        SPRINGS (16,060 rows), ESTERO (5,126), NAPLES (403 - Lee County addresses in Naples ZIP 34110), plus ''BONITA
        SPGS'' (1) and ''NORTH FORT MYERS'' (2). Match Bonita Springs with LIKE ''BONITA SP%''.'
      ai_context:
        synonyms:
        - property city
        - situs city
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: situs_state
      label: Parcel Address
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: situs_state
      description: The two-letter USPS postal abbreviation for the state/protectorate/commonwealth associated with
        the property address (e.g., CA, VI).
      ai_context:
        synonyms:
        - property state
        - situs state
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: situs_zip_code
      label: Parcel Address
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: situs_zip_code
      description: 'USPS zip code for the property address, assigned by various source files and proprietary/non-proprietary
        processes. May be the 5-digit zip or the 9-digit Zip+4 (91% are Zip+4 here), so match on the first five
        digits (LIKE ''34135%''). Main ZIPs in this study table: 34135 (17,441 rows), 34134 (2,765), 33928 (941),
        34110 (403).'
      ai_context:
        synonyms:
        - property zip
        - situs zip
        - zip+4
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: mailing_city
      label: Owner Mailing
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: StdCityName
      description: 'The city associated with the owner''s mailing address. Business field name in the product spec:
        MAILING CITY.'
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: mailing_state
      label: Owner Mailing
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: StdStCd
      description: 'The two-letter USPS postal abbreviation for the state/protectorate/commonwealth associated with
        the mailing address (e.g., CA, VI). Business field name in the product spec: MAILING STATE.'
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: mailing_zip_code
      label: Owner Mailing
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: StdZipCd
      description: 'USPS zip code for the mailing address. May be the 5-digit zip or the 9-digit Zip+4 (e.g., 00501
        or 954630042). Business field name in the product spec: MAILING ZIP CODE.'
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: mailing_opt_out_indicator
      label: Owner Mailing
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: AddrOptSourceCd
      description: 'Indicates the property owner has contacted the DMA (Direct Marketing Association) to opt out
        of mail solicitation. NULL/blank means no opt-out is on file - it does not mean opted-in. Business field
        name in the product spec: MAILING OPT OUT INDICATOR.'
      ai_context:
        synonyms:
        - opt out
        - do not mail
        instructions: 'BigQuery type: STRING. Flag column. Common filter column. Value groups: opted out (Owner
          has opted out of direct mail via the DMA): ''Y''; no opt out on file (No opt-out on file (NULL/blank)
          - not evidence of opt-in): NULL.'
    - name: geom
      label: Primary Geometry
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: geom
      description: 'Parcel boundary polygon as a native GEOGRAPHY column (EPSG:4326) - use it directly in ST_ functions
        and never wrap it in ST_GEOGFROMTEXT. Every value is a single POLYGON. It is the primary geometry (the CARTO
        geomField of this table) and the source of the lot size of record: ST_AREA(ANY_VALUE(geom)) / 4046.8564224
        = parcel acres, computed once per parcel_shape_id. The table is not clustered, so spatial predicates against
        it go directly in WHERE. Cannot appear in GROUP BY or SELECT DISTINCT.'
      ai_context:
        synonyms:
        - parcel boundary
        - parcel shape
        - geometry
        instructions: 'BigQuery type: GEOGRAPHY.'
      custom_extensions:
      - vendor_name: CARTO
        data: '{"spatial_data": {"type": "polygon", "srid": 4326}}'
    - name: parcel_centroid_longitude
      label: Centroid Point
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: parcel_longitude
      description: 'EPSG:4326 longitude in decimal degrees of either the centroid of the parcel shape geometry or
        a point that falls inside it. Business field name in the product spec: PARCEL CENTROID LONGITUDE.'
      ai_context:
        synonyms:
        - centroid longitude
        - parcel longitude
        instructions: 'BigQuery type: NUMERIC. Coordinate (longitude, EPSG:4326) paired with parcel_latitude. Build
          a point with ST_GEOGPOINT(CAST(parcel_longitude AS FLOAT64), CAST(parcel_latitude AS FLOAT64)) - longitude
          first. For maps and boundaries prefer the parcel polygon geom; this point is the fallback when only a
          point is needed.'
    - name: parcel_centroid_latitude
      label: Centroid Point
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: parcel_latitude
      description: 'EPSG:4326 latitude in decimal degrees of either the centroid of the parcel shape geometry or
        a point that falls inside it. Business field name in the product spec: PARCEL CENTROID LATITUDE.'
      ai_context:
        synonyms:
        - centroid latitude
        - parcel latitude
        instructions: 'BigQuery type: NUMERIC. Coordinate (latitude, EPSG:4326) paired with parcel_longitude. Build
          a point with ST_GEOGPOINT(CAST(parcel_longitude AS FLOAT64), CAST(parcel_latitude AS FLOAT64)) - longitude
          first. For maps and boundaries prefer the parcel polygon geom; this point is the fallback when only a
          point is needed.'
    - name: parcel_centroid_geohash
      label: Centroid Point
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: parcel_centroid_geohash
      description: Geohash encoding of parcel_longitude/parcel_latitude. Informational only - not a renderable geometry
        and not spatially queryable on its own.
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: location_longitude
      label: Point
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: location_longitude
      description: 'EPSG:4326 longitude in decimal degrees of an alternate point for the property (NUMERIC). Property
        (CLIP)-grain: it differs among the clips of 12 shared parcels, and falls outside the parcel polygon for
        148 of 15,325 parcels (1.0%) - prefer parcel_longitude/parcel_latitude for a representative point.'
      ai_context:
        synonyms:
        - location longitude
        instructions: 'BigQuery type: NUMERIC. Coordinate (longitude, EPSG:4326) paired with location_latitude.
          Build a point with ST_GEOGPOINT(CAST(location_longitude AS FLOAT64), CAST(location_latitude AS FLOAT64))
          - longitude first.'
    - name: location_latitude
      label: Point
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: location_latitude
      description: 'EPSG:4326 latitude in decimal degrees of an alternate point for the property (NUMERIC). Property
        (CLIP)-grain: it differs among the clips of 12 shared parcels, and falls outside the parcel polygon for
        148 of 15,325 parcels (1.0%) - prefer parcel_longitude/parcel_latitude for a representative point.'
      ai_context:
        synonyms:
        - location latitude
        instructions: 'BigQuery type: NUMERIC. Coordinate (latitude, EPSG:4326) paired with location_longitude.
          Build a point with ST_GEOGPOINT(CAST(location_longitude AS FLOAT64), CAST(location_latitude AS FLOAT64))
          - longitude first.'
    - name: location_geohash
      label: Point
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: location_geohash
      description: Geohash encoding of location_longitude/location_latitude. Informational only - not a renderable
        geometry and not spatially queryable on its own.
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: source_record_date
      label: Dates
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: src_record_date
      description: 'Date the parcel shape was first identified. Delivered as a string, not a native DATE type -
        cast/parse before doing date arithmetic. Business field name in the product spec: SOURCE RECORD DATE.'
      ai_context:
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: record_update_date
      label: Dates
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: src_record_update_date
      description: 'Date the parcel record was most recently updated. Delivered as a string, not a native DATE type
        - cast/parse before doing date arithmetic. Business field name in the product spec: RECORD UPDATE DATE.'
      ai_context:
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: standardized_fips_code
      label: Property ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CntyCd
      description: 'A defined, persistent, 5-digit code that uniquely identifies every county or county equivalent.
        May be based on a prior version of the FIPS code rather than the current one; in this study table it is
        ''12071'' on every row, the same as fips. Business field name in the product spec: STANDARDIZED FIPS CODE.'
      ai_context:
        synonyms:
        - standardized fips
        instructions: 'BigQuery type: STRING. Single value in this table: ''12071''.'
    - name: apn_sequence_number
      label: Property ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PclSeqNbr
      description: 'Internal sequence number used to ensure uniqueness of the Assessor''s Parcel Number. Not a metric
        - do not aggregate. Business field name in the product spec: APN SEQUENCE NUMBER.'
      ai_context:
        instructions: 'BigQuery type: INT64.'
    - name: composite_property_linkage_key
      label: Property ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: compositepropertylinkagekey
      description: 'Unique property key used to link to other (legacy product) files. Fixed-width: the APN component
        is padded with blanks out to 45 characters within the composite key - trim before displaying or joining
        on it. Business field name in the product spec: COMPOSITE PROPERTY LINKAGE KEY.'
      ai_context:
        synonyms:
        - linkage key
        - legacy property key
        instructions: 'BigQuery type: STRING. Identifier column.'
    - name: fips_code
      label: Property ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: fips
      description: 'The current 5-digit Federal Information Processing Series code of the county or county equivalent,
        from the property record. ''12071'' (Lee County, FL) on every row of this study table - it never narrows
        a query here, and a question about any other county has no rows. Equal to statecode||countycode and CntyCd
        on every row. Business field name in the product spec: FIPS CODE.'
      ai_context:
        synonyms:
        - fips
        - county fips code
        instructions: 'BigQuery type: STRING. 5-digit current FIPS; the single value in this table is ''12071''.'
    - name: tax_account_number
      label: Property ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: AcctNbr
      description: 'The county or source number used primarily for billing. Typically not unique to a parcel - multiple
        parcels can be combined on one tax bill. In Lee County it holds the 8-digit Folio ID and is identical to
        alternate_apn on every row (one per property here). Business field name in the product spec: TAX ACCOUNT
        NUMBER.'
      ai_context:
        synonyms:
        - tax account
        - billing account number
        instructions: 'BigQuery type: STRING.'
    - name: online_formatted_parcel_id
      label: Property ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PclIdIrisFrmtd
      description: 'APN reformatted to align with the display conventions used by certain online applications -
        typically the dashed form users quote. In Lee County it is the dashed STRAP number (''22-47-25-B4-0040I.0010'',
        where original_apn is ''224725B40040I0010''); removing the dashes and dots gives original_apn on every row.
        Include it when matching a user-supplied APN. Business field name in the product spec: ONLINE FORMATTED
        PARCEL ID.'
      ai_context:
        synonyms:
        - formatted apn
        - formatted parcel id
        instructions: 'BigQuery type: STRING.'
    - name: census_id
      label: Location
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: SitusCensID
      description: 'Composite of Census Tract, Census Block Group, Census Block, and Census Block Suffix, as established
        by the US Census Bureau (here 10 characters: 6-digit tract + 1-digit block group + 3-digit block, e.g. ''0505021007'').
        It comes from the property record in a different census vintage from census_tract_id: its tract prefix disagrees
        with census_tract_id on 4.6% of rows and shows 26 distinct tracts against 8, so never use it for tract or
        block group grouping - use tract_geoid. Business field name in the product spec: CENSUS ID.'
      ai_context:
        synonyms:
        - census geography id
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: range
      label: Location
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: RangeCd
      description: 'The Public Land Survey System (PLSS) ''range'' portion of the property''s legal description
        - numbered east or west of a predetermined meridian in six-mile intervals, extending north-south. Business
        field name in the product spec: RANGE.'
      ai_context:
        synonyms:
        - plss range
        - survey range
        instructions: 'BigQuery type: STRING.'
    - name: township
      label: Location
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: TownshipCd
      description: 'The Public Land Survey System (PLSS) ''township'' portion of the property''s legal description
        - numbered north or south of a predetermined baseline in six-mile intervals, extending east-west. Business
        field name in the product spec: TOWNSHIP.'
      ai_context:
        synonyms:
        - plss township
        - survey township
        instructions: 'BigQuery type: STRING.'
    - name: section
      label: Location
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: SectionCd
      description: 'The Public Land Survey System (PLSS) ''section'' portion of the property''s legal description
        - a one-square-mile subdivision; there are 36 sections within the intersection of a range/township. This
        is a PLSS survey term, not a reference to any grouping within this document or table. Business field name
        in the product spec: SECTION.'
      ai_context:
        synonyms:
        - plss section
        - survey section
        instructions: 'BigQuery type: STRING.'
    - name: quarter_section
      label: Location
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: QTRSectionCd
      description: 'A PLSS section divided into four sub-sections (e.g., NE, NW, SE, SW). Business field name in
        the product spec: QUARTER SECTION. NOT POPULATED IN THIS TABLE: entirely NULL on every row of the study
        extract, so questions about this attribute cannot be answered here - say so rather than filtering on it.'
      ai_context:
        synonyms:
        - plss quarter section
        instructions: 'BigQuery type: STRING.'
    - name: land_use_code
      label: Property
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: IrisLandUseCd
      description: 'Proprietary Cotality land use code, converted from various county land use codes, to aid search
        and extract. Always a 3-digit string, never NULL in this table (74 distinct codes here), organized in numeric
        bands by broad category. A filter on this column is MANDATORY for any homes/residential question - the table
        contains every property type. The 1xx ''residential'' band also holds hotels, motels, a nursing home, an
        orphanage and whole apartment buildings, so use the homes value group for homes/houses and ''163'' for single-family
        (see LAND USE in the dataset instructions). Most common here: 163 SFR, 112 CONDOMINIUM, 137 MOBILE HOME,
        465 RESIDENTIAL LOT, 132 MULTI FAMILY 10 UNITS LESS, 400 VACANT LAND. Business field name in the product
        spec: LAND USE CODE.'
      ai_context:
        synonyms:
        - land use
        - use code
        - zoning classification
        - property use type
        instructions: 'BigQuery type: STRING. High-cardinality code column (50+ distinct codes). The full code list
          lives in a separate product lookup table that is not part of this model; to see which codes occur, run
          SELECT DISTINCT IrisLandUseCd for the area of interest. Value groups: residential (Whole residential band
          (100-199): dwellings plus hotels/motels, group quarters, timeshares, common areas and apartment buildings
          - use only for broad ''residential property'' questions): sample codes ''100'', ''102'', ''103'', ''106'',
          ''112'', ''131'', ''137'', ''163''; homes (Individual dwellings for homes/houses questions: residential
          NEC, townhouse, cabin, co-op, condo (incl. mid/high-rise), duplex, triplex, quadruplex, mobile/manufactured
          home, PUD, rural homesite, SFR): sample codes ''100'', ''102'', ''109'', ''111'', ''112'', ''115'', ''116'',
          ''117'', ''137'', ''138'', ''148'', ''151'', ''160'', ''163'', ''165''; single family (Single-family residence
          (SFR). Note 106 is APARTMENT, not single-family): sample codes ''163''; multifamily buildings (Whole apartment
          / multi-family buildings and complexes): sample codes ''103'', ''106'', ''131'', ''132'', ''133'', ''134'',
          ''136''; lodging and group quarters (Hotels, motels, transient lodging, timeshares, dormitories, group
          quarters, nursing homes - in the 1xx band but not homes): sample codes ''118'', ''119'', ''127'', ''130'',
          ''142'', ''155'', ''156'', ''157'', ''164'', ''167'', ''199''; commercial (Office, retail, hotel, mixed
          commercial use (200-299)): sample codes ''200'', ''201'', ''202''; industrial (Manufacturing, warehousing,
          extraction, utilities (300-399)): sample codes ''300'', ''320'', ''324'', ''336'', ''358'', ''364''; vacant
          (Vacant or unimproved land (400-499)): sample codes ''400'', ''401'', ''410''.'
    - name: zoning_code
      label: Property
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ZnCd
      description: 'County and/or local jurisdiction zoning code. Explicitly NOT standardized across jurisdictions
        - do not treat this as a reliable filter enum or compare values across counties. Business field name in
        the product spec: ZONING CODE.'
      ai_context:
        synonyms:
        - zoning
        instructions: 'BigQuery type: STRING.'
    - name: property_indicator_code
      label: Property
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PropIndCd
      description: 'Proprietary general code used to quickly recognize specific property types (e.g., Single Family
        Residence, Condominium, Commercial). Business field name in the product spec: PROPERTY INDICATOR CODE.'
      ai_context:
        synonyms:
        - property type
        - property indicator
        instructions: 'BigQuery type: STRING. Common filter column. Value groups: residential (Housing types): ''10'',
          ''11'', ''21'', ''22'', ''23''; commercial (Commercial property types): ''20'', ''24'', ''25'', ''26'',
          ''27'', ''28'', ''29'', ''30'', ''31'', ''32''; industrial (Industrial property types): ''50'', ''51'',
          ''52'', ''53'', ''54''; other (Agricultural, vacant, exempt, or unclassified): ''00'', ''70'', ''80'',
          ''90''.'
    - name: manufactured_home_indicator
      label: Property
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: MobileHomeInd
      description: 'Indicates a manufactured home is present on the parcel. Presence encoding: the only populated
        value is ''Y''; NULL/blank means not indicated (not confirmed absent) and no ''N'' value exists - WHERE
        MobileHomeInd = ''N'' matches nothing; use IS NULL for the negative case. Business field name in the product
        spec: MANUFACTURED HOME INDICATOR.'
      ai_context:
        synonyms:
        - mobile home
        - manufactured home
        instructions: 'BigQuery type: STRING. Flag column. Common filter column. Value groups: present (Manufactured
          home present): ''Y''; not indicated (Not indicated (NULL/blank) - not confirmed absent): NULL.'
    - name: number_of_buildings
      label: Property
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: SumNbrBldg
      description: 'Total number of buildings on the parcel. Property (CLIP)-grain value - repeats on every row
        sharing the same clip; dedupe on clip before aggregating. Business field name in the product spec: NUMBER
        OF BUILDINGS.'
      ai_context:
        synonyms:
        - building count
        instructions: 'BigQuery type: INT64. Numeric measure, unit: count.'
    - name: location_influence_code
      label: Property (Premium)
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: UnvLocationInfoCd
      description: 'Positive or negative locational aspects of the parcel (e.g., Waterfront, Flood Plain, Airport).
        Very high-cardinality (~220+ codes), grouped below into a few example categories. Business field name in
        the product spec: LOCATION INFLUENCE CODE.'
      ai_context:
        synonyms:
        - location influence
        - site influence
        instructions: 'BigQuery type: STRING. High-cardinality code column (50+ distinct codes). The full code list
          lives in a separate product lookup table that is not part of this model; to see which codes occur, run
          SELECT DISTINCT UnvLocationInfoCd for the area of interest. Value groups: waterfront positive (Water-adjacent,
          generally positive influences (bay, canal, beach, creek)): sample codes ''IBF'', ''IBC'', ''ICF'', ''ICB'',
          ''ICK''; access or layout (Lot access/shape influences (corner, cul-de-sac, alley, dead end)): sample
          codes ''ICR'', ''ICU'', ''IAL'', ''IDD''; other (Airport, agricultural, business, and other proximity
          influences): sample codes ''IAI'', ''IAG'', ''IBS''.'
    - name: view_code
      label: Property (Premium)
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: UnvViewCd
      description: 'View from the building (e.g., Gulf, Mountains, Pool). Business field name in the product spec:
        VIEW CODE.'
      ai_context:
        synonyms:
        - view
        - view type
        instructions: 'BigQuery type: STRING. The full code list lives in a separate product lookup table that is
          not part of this model; to see which codes occur, run SELECT DISTINCT UnvViewCd for the area of interest.
          Value groups: sample (~50 codes describing the view amenity; request the full VIEW lookup table to enumerate
          all values).'
    - name: electricity_wiring_type_code
      label: Utilities
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: UnvElectCd
      description: 'Type of electricity and/or wiring within the building (e.g., Average Wiring, Underground Wired,
        Private Source). Business field name in the product spec: ELECTRICITY/WIRING TYPE CODE. NOT POPULATED IN
        THIS TABLE: entirely NULL on every row of the study extract, so questions about this attribute cannot be
        answered here - say so rather than filtering on it.'
      ai_context:
        synonyms:
        - electrical type
        - wiring type
        instructions: 'BigQuery type: STRING. Value groups: none or unknown (No electricity / unknown / bypass):
          ''000'', ''001'', ''999''; wiring amount (Amount/extent of wiring): ''EAG'', ''EBA'', ''EEX'', ''EGO'',
          ''EHE'', ''ELI'', ''EMA'', ''EME'', ''EMI'', ''ETY''; wiring configuration (Wiring configuration or source):
          ''ECN'', ''EAV'', ''EOV'', ''EPR'', ''EUN''.'
    - name: fuel_type_code
      label: Utilities
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: UnvFuelCd
      description: 'Type of fuel used for heating water and the building (e.g., Solar, Gas, Oil). Business field
        name in the product spec: FUEL TYPE CODE.'
      ai_context:
        synonyms:
        - fuel type
        - heating fuel
        instructions: 'BigQuery type: STRING. The full code list lives in a separate product lookup table that is
          not part of this model; to see which codes occur, run SELECT DISTINCT UnvFuelCd for the area of interest.
          Value groups: sample (~35 codes for fuel source (gas, electric, oil, solar, etc.); request the full FUEL
          lookup table to enumerate all values).'
    - name: sewer_type_code
      label: Utilities
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: UnvSewerCd
      description: 'Type of sewer system on the parcel (e.g., Public, Septic, Commercial). Business field name in
        the product spec: SEWER TYPE CODE. NOT POPULATED IN THIS TABLE: entirely NULL on every row of the study
        extract, so questions about this attribute cannot be answered here - say so rather than filtering on it.'
      ai_context:
        synonyms:
        - sewer type
        instructions: 'BigQuery type: STRING. Common filter column. Value groups: none or unknown (No sewer / unknown
          / bypass): ''000'', ''001'', ''999''; sewer (Sewer service types): ''SPU'', ''SPR'', ''SCO'', ''SCE'',
          ''STR''.'
    - name: water_type_code
      label: Utilities
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: UnvWaterCd
      description: 'Type of water service on the parcel (e.g., Public, Well, Cistern). CRITICAL DATA GAP: the lookup
        table for this code (WATER) was not present in the delivered lookup-table export - see the review for details.
        Values cannot be enumerated or grouped until that table is supplied. Business field name in the product
        spec: WATER TYPE CODE. NOT POPULATED IN THIS TABLE: entirely NULL on every row of the study extract, so
        questions about this attribute cannot be answered here - say so rather than filtering on it.'
      ai_context:
        synonyms:
        - water type
        - water service
        instructions: 'BigQuery type: STRING. Common filter column. The full code list lives in a separate product
          lookup table that is not part of this model; to see which codes occur, run SELECT DISTINCT UnvWaterCd
          for the area of interest.'
    - name: legal_block_number
      label: Property Legal
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: LegalBlkID
      description: 'County block number where the parcel is located. Part of a subdivision/tract legal description
        - subdivisions are broken into blocks, which are broken into lots. Business field name in the product spec:
        LEGAL BLOCK NUMBER.'
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: legal_lot_number
      label: Property Legal
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: LegalLot
      description: 'Subdivision or county map lot number. Part of a subdivision/tract legal description. Business
        field name in the product spec: LEGAL LOT NUMBER.'
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: subdivision_tract_number
      label: Property Legal
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: TractNbr
      description: 'The unique number assigned to a specific subdivision by the county. Often used in lieu of an
        actual subdivision name. Business field name in the product spec: SUBDIVISION TRACT NUMBER.'
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: subdivision_plat_book
      label: Property Legal
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: SubPlatBk
      description: 'First component of the recording system some counties use to catalog subdivision/condo plans
        (e.g., Book 123 Page 55A). Business field name in the product spec: SUBDIVISION PLAT BOOK.'
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: subdivision_plat_page
      label: Property Legal
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: SubPlatPg
      description: 'Second component of the recording system some counties use to catalog subdivision/condo plans
        (e.g., Book 123 Page 55A). Business field name in the product spec: SUBDIVISION PLAT PAGE.'
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: subdivision_name
      label: Property Legal
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: subdname
      description: 'Name of the subdivision or condominium where the parcel is located (e.g., Highland Mills Estates,
        Crystal Towers Condo). Business field name in the product spec: SUBDIVISION NAME.'
      ai_context:
        synonyms:
        - subdivision
        - neighborhood name
        instructions: 'BigQuery type: STRING. Common filter column.'
    - name: legal_description
      label: Legal Description
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: legal_description
      description: County or local jurisdiction legal property description (first 750 bytes). Delineates property
        boundaries and may include mineral rights, layout, and other details. Equivalent to legal1 + legal2 + legal3
        concatenated.
      ai_context:
        synonyms:
        - legal description
        instructions: 'BigQuery type: STRING.'
    - name: legal1
      label: Legal Description
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: legal1
      description: First 250-byte segment of the legal description (bytes 1-250 of the same text as legal_description).
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: legal2
      label: Legal Description
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: legal2
      description: Second 250-byte segment of the legal description (bytes 251-500 of the same text as legal_description).
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: legal3
      label: Legal Description
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: legal3
      description: Third 250-byte segment of the legal description (bytes 501-750 of the same text as legal_description).
      ai_context:
        instructions: 'BigQuery type: STRING.'
    - name: calculated_total_value
      label: Tax
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: UnvTotalValAmt
      description: 'The best-available current-market total value (land + improvement), selected per UnvTotalValSourceInd
        from the assessed/market/appraised families. In this table it is seeded from the market family on every
        row and equals MktTotalValAmt wherever populated; NULL on 3.4% of properties. Default choice for general
        ''what is this worth'' questions. Property (CLIP)-grain value - repeats on every row sharing the same clip;
        dedupe on clip before aggregating. Business field name in the product spec: CALCULATED TOTAL VALUE.'
      ai_context:
        synonyms:
        - total value
        - property value
        - market value
        instructions: 'BigQuery type: INT64. Numeric measure, unit: USD.'
    - name: calculated_land_value
      label: Tax
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: UnvLandValAmt
      description: 'The best-available current-market land value, selected per UnvTotalValSourceInd. Property (CLIP)-grain
        value - repeats on every row sharing the same clip; dedupe on clip before aggregating. Business field name
        in the product spec: CALCULATED LAND VALUE.'
      ai_context:
        synonyms:
        - land value
        instructions: 'BigQuery type: INT64. Numeric measure, unit: USD.'
    - name: calculated_improvement_value
      label: Tax
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: UnvImpvValAmt
      description: 'The best-available current-market improvement (structure) value, selected per UnvTotalValSourceInd.
        Property (CLIP)-grain value - repeats on every row sharing the same clip; dedupe on clip before aggregating.
        Business field name in the product spec: CALCULATED IMPROVEMENT VALUE.'
      ai_context:
        synonyms:
        - improvement value
        instructions: 'BigQuery type: INT64. Numeric measure, unit: USD.'
    - name: calculated_total_value_source_code
      label: Tax
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: UnvTotalValSourceInd
      description: 'Which value family was used to seed UnvTotalValAmt. ''M'' (market) on every row of this study
        table. Business field name in the product spec: CALCULATED TOTAL VALUE SOURCE CODE.'
      ai_context:
        synonyms:
        - value source
        instructions: 'BigQuery type: STRING. Common filter column. Value groups: assessed (Seeded from assessed
          value): ''A''; market (Seeded from market value): ''M''; appraised (Seeded from appraised value): ''P'';
          transitional (Seeded from transitional value): ''T''.'
    - name: calculated_total_land_value_source_code
      label: Tax
      expression:
        dialects:
        - dialect: ANSI_SQL
