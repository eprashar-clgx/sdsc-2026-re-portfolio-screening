# Generated by prep/semantic_models/build_semantic_model.py - do not edit by hand.
# Tables: YOUR_PROJECT.YOUR_DATASET.<name>
# Before importing: replace YOUR_PROJECT.YOUR_DATASET with the project and dataset of the
# tables you imported (find and replace, every occurrence).
version: 0.1.1
semantic_model:
- name: sdsc_portfolio_screening
  description: 'Portfolio screening for south Lee County, Florida (8 census tracts in Bonita Springs and Estero):
    the user''s 931-property portfolio with Cotality climate risk (portfolio_risk), an H3 resolution-9 growth and
    risk grid (growth_h3_r9), Cotality Growth Intelligence for the 918 properties in a growth stage (growth_parcels)
    and Parcel Essentials for every parcel (parcel_essentials). Cells are classified into Pursue, Watchlist, Hold
    and Reassess by fixed growth and risk cutoffs.'
  ai_context:
    synonyms:
    - portfolio screening
    - growth and risk
    - growth x risk
    - watchlist
    - 2x2
    instructions: |
      WORKSHOP: this map supports a portfolio screening exercise in south Lee County, Florida - which of the user's properties sit where new development (growth) meets high climate risk. Four tables, all in one dataset:
        portfolio_risk    `YOUR_PROJECT.YOUR_DATASET.portfolio_risk` - the user's portfolio: 931 properties, one row per property (clip), with Cotality climate risk scores and the H3 cell (h3) of the property's location.
        growth_h3_r9      `YOUR_PROJECT.YOUR_DATASET.growth_h3_r9` - 459 H3 resolution-9 cells with parcel counts, growth counts and composite risk score (CRS) medians, raw and smoothed over each cell and its 6 neighbours (k1_*). Cells with fewer than 5 parcels are excluded.
        growth_parcels    `YOUR_PROJECT.YOUR_DATASET.growth_parcels` - 918 properties in a growth stage (Cotality Growth Intelligence), one row per property, with the parcel centroid (geom) and H3 cell (h3).
        parcel_essentials `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` - Parcel Essentials for all 21,447 properties on 15,325 parcels in the study area, one row per (parcel_shape_id, clip) pair.
      "My properties", "my portfolio", "our properties" and "the portfolio" always mean portfolio_risk. parcel_essentials and growth_parcels describe the market around the portfolio, never the user's holdings.

      JOINS:
        portfolio_risk to growth_h3_r9: portfolio_risk.h3 = growth_h3_r9.h3 (h3 is the resolution-9 cell of the property's lat/lon). 930 of the 931 properties fall in a cell; the other lies in an excluded cell - report it as not assigned to a cell rather than dropping it silently.
        growth_parcels to growth_h3_r9: growth_parcels.h3 = growth_h3_r9.h3 (913 of 918; 5 lie in excluded cells).
        portfolio_risk to parcel_essentials: clip. parcel_essentials has one row per (parcel_shape_id, clip), so collapse it to one row per clip (GROUP BY clip with ANY_VALUE) before joining, or count with COUNT(DISTINCT clip). 930 of the 931 portfolio CLIPs are in parcel_essentials.
        growth_parcels to parcel_essentials: clip (see JOIN below).
        Never join portfolio_risk to growth_parcels on clip: the portfolio holds only existing properties, so no CLIP is in both tables. Relate them through the H3 cell.

      CELL CLASSIFICATION (fixed cutoffs - the study-area medians over the 459 cells; do not recompute them or use other thresholds unless the user asks):
        growth class: 'High growth' when k1_growth_share > 0.013, otherwise 'Low growth'.
        risk class: 'High risk' when k1_crs_median >= 61, otherwise 'Low risk'. k1_crs_median is NULL in 4 cells: their risk class and quadrant are 'Unclassified'.
        quadrant: High growth + Low risk = 'Pursue'; High growth + High risk = 'Watchlist'; Low growth + Low risk = 'Hold'; Low growth + High risk = 'Reassess'.
        Classify with the smoothed k1_growth_share and k1_crs_median, never with growth_share or crs_median: a single cell holds about 2 growth parcels, too few to classify on its own. A property's growth class, risk class and quadrant are those of its cell. The growth_h3_r9 fields growth_class, risk_class and quadrant implement these rules; in SQL, write the same CASE expressions.
        Result: Pursue 62 cells, Watchlist 158, Hold 158, Reassess 77, Unclassified 4.

      AGGREGATION:
        total_parcels, growth_parcels and crs_parcels are additive across cells: SUM them. Never SUM the k1_* columns - each cell's k1 values include its 6 neighbours, so a sum counts parcels up to 7 times.
        The growth share of a group of cells is SUM(growth_parcels) / SUM(total_parcels), not AVG(growth_share).
        CRS values (crs_median, k1_crs_median) and the portfolio risk scores are not additive: use AVG, MIN, MAX or a median.
        Aggregate cell measures over distinct cells. When a question also counts properties, compute the cell totals and the property counts in separate CTEs and join them on the group (e.g. quadrant); joining properties to cells first repeats each cell once per property.
        Count portfolio properties with COUNT(DISTINCT portfolio_risk.clip).

      TWO LEVELS OF RISK: cell risk is k1_crs_median, the neighbourhood median of the Parcel Essentials composite risk score (crs, 1-100). Property risk is portfolio_risk.risk_score, Cotality's all-perils climate risk score (1-100) for that property, ranked within its property type (risk_type_score_group). They are different measures on different scales: never compare their raw values. Compare classes instead: a property has 'High property risk' when risk_score >= 59 (the portfolio median) and 'Low property risk' otherwise (field property_risk_class); set that against its cell's risk class. 3 portfolio properties have no climate scores; report them as unscored.

      PORTFOLIO RISK FIELDS: risk_score = call_score (all perils, today). cfl_score is flood (inland + storm surge), tcwi_score hurricane wind; the *_2050 columns are 2050 scores under SSP2-4.5 (middle) and SSP5-8.5 (high emissions); the *_aal_ratio columns are expected annual loss as a share of property value. Scores rise with expected loss within a property type, not across types.

      MAPS: every table's geometry column is geom - polygons in growth_h3_r9 (cells) and parcel_essentials (parcels), points in portfolio_risk and growth_parcels. To colour cells by quadrant, select h3, the quadrant CASE expression and geom from growth_h3_r9.

      STUDY AREA: both tables cover only the same eight 2020 Census tracts of Lee County, FL (fips 12071 - Bonita Springs and Estero): tract_geoid IN ('12071050315', '12071050316', '12071050317', '12071050318', '12071050401', '12071050502', '12071050601', '12071050603'). Questions about "the study area", "the map area" or "all properties" need no geographic filter. A question about any other state, county, city or tract has no rows here - say that the data covers only this study area rather than reporting that nothing matched.
      JOIN: growth_parcels has the parcel centroid point (geom) and its H3 cell (h3), but no address, land use, lot size or parcel polygon, so address, ZIP, city, land-use, block-group and parcel-polygon questions need:
        FROM `YOUR_PROJECT.YOUR_DATASET.growth_parcels` g
        JOIN `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` p ON p.clip = g.clip
      Both clip columns are 10-digit STRINGs, so no CAST is needed. All 918 growth properties match a parcel_essentials clip (verified 2026-10-14), so an INNER JOIN drops none of them. The join returns 919 rows because one property (clip 5167985792) spans two parcel shapes, and 25 parcels carry three growth properties each: count properties with COUNT(DISTINCT g.clip), count parcels with COUNT(DISTINCT p.parcel_shape_id), and collapse to one row per clip before AVG of a growth column.
      PROPERTIES WITHOUT A GROWTH ROW: 20,529 of the 21,447 properties in parcel_essentials (95.7%) have no growth_parcels row. Absence means the property was in no growth stage in the production release the table was cut from (built 2026-10-11) - it is not missing data and not an unknown stage, so describe those properties as "not in a growth stage". For shares of all properties take the denominator from parcel_essentials, with a LEFT JOIN to growth_parcels. The table is a fixed extract: a property that entered a growth stage after that release is not in it.
      GEOGRAPHY FILTERS: filter a census tract with g.tract_geoid, which needs no join (see CENSUS TRACTS). ZIP, city, block-group and drawn-area filters use parcel_essentials columns through the join, in the forms given in the parcel_essentials SUB-AREA SELECTION instructions.
      CENSUS TRACTS: g.tract_geoid is the property's 11-digit tract GEOID and agrees with p.tract_geoid for all 918 properties (for clip 5167985792, whose two parcel shapes lie in tracts 12071050401 and 12071050502, it holds 12071050502), so tract filters and per-tract growth counts need no join: WHERE g.tract_geoid = '12071050318'. When a question also needs parcel columns, filter and group on g.tract_geoid for one tract per property; p.tract_geoid is parcel-grain and puts clip 5167985792 in both of its tracts. Tract 12071050315 has no growth property. Block groups exist only in parcel_essentials: CONCAT(p.tract_geoid, p.census_blockgroup_id).
      WORKSHOP SCOPE: the workshop map's data source and both tables cover the same eight tracts, so SQL needs no tract filter to match the map area. Filter only when the user names a tract, block group, ZIP, city or drawn area.
      COLUMNS READ: both tables are small (about 115 KB and 50 MB) and no filter narrows what BigQuery reads, so cost is not a concern. Still select only the columns the answer needs, and reference p.geom only for maps, boundaries or spatial tests.
      MAPS: to show growth properties on the map, select p.geom (the parcel polygon) with the growth attributes; for points use g.geom (the parcel centroid) - no join needed. A parcel shared by several growth properties (25 parcels, three properties each) appears once per property with the same polygon, and clip 5167985792 appears once per parcel shape.
    examples:
    - |
      Q: Which of my properties sit in high-growth cells?
      Notes: Assign each property to its cell with portfolio_risk.h3 = growth_h3_r9.h3 and keep cells with k1_growth_share > 0.013. Expect 474 of the 931 properties (238 in Pursue cells, 236 in Watchlist cells). Never join to growth_parcels on clip - that returns nothing.
      SQL: SELECT p.clip, p.resolved_address, p.risk_score, c.h3, c.k1_growth_share, p.geom FROM `YOUR_PROJECT.YOUR_DATASET.portfolio_risk` p JOIN `YOUR_PROJECT.YOUR_DATASET.growth_h3_r9` c USING (h3) WHERE c.k1_growth_share > 0.013 ORDER BY c.k1_growth_share DESC
    - |
      Q: Classify the cells into Pursue, Watchlist, Hold and Reassess and colour the map by quadrant.
      Notes: Fixed cutoffs: high growth k1_growth_share > 0.013, high risk k1_crs_median >= 61. Returns 459 cells: Pursue 62, Watchlist 158, Hold 158, Reassess 77, Unclassified 4 (no CRS).
      SQL: SELECT h3, CASE WHEN k1_crs_median IS NULL THEN 'Unclassified' WHEN k1_growth_share > 0.013 AND k1_crs_median >= 61 THEN 'Watchlist' WHEN k1_growth_share > 0.013 THEN 'Pursue' WHEN k1_crs_median >= 61 THEN 'Reassess' ELSE 'Hold' END AS quadrant, k1_growth_share, k1_crs_median, geom FROM `YOUR_PROJECT.YOUR_DATASET.growth_h3_r9`
    - |
      Q: For each quadrant, show the number of cells, my properties and growth parcels, the average growth parcels per cell, and the mix of growth stages.
      Notes: Cell totals, property counts and stage counts each get their own CTE, joined on quadrant, so no cell is counted once per property. Sum the raw growth_parcels, never k1_growth_parcels. Expect Watchlist: 158 cells, 236 properties, 608 growth parcels (3.85 per cell; 262 early, 107 ongoing, 239 completed); Pursue: 62, 238, 276 (4.45); Hold: 158, 222, 9; Reassess: 77, 234, 18; Unclassified: 4 cells, no properties.
      SQL: WITH cells AS (SELECT h3, total_parcels, growth_parcels, CASE WHEN k1_crs_median IS NULL THEN 'Unclassified' WHEN k1_growth_share > 0.013 AND k1_crs_median >= 61 THEN 'Watchlist' WHEN k1_growth_share > 0.013 THEN 'Pursue' WHEN k1_crs_median >= 61 THEN 'Reassess' ELSE 'Hold' END AS quadrant FROM `YOUR_PROJECT.YOUR_DATASET.growth_h3_r9`), props AS (SELECT c.quadrant, COUNT(DISTINCT p.clip) AS my_properties FROM `YOUR_PROJECT.YOUR_DATASET.portfolio_risk` p JOIN cells c USING (h3) GROUP BY 1), stages AS (SELECT c.quadrant, COUNTIF(g.growth_stage = 'Early Growth') AS early_growth, COUNTIF(g.growth_stage = 'Ongoing Growth') AS ongoing_growth, COUNTIF(g.growth_stage = 'Recently Completed') AS recently_completed FROM `YOUR_PROJECT.YOUR_DATASET.growth_parcels` g JOIN cells c USING (h3) GROUP BY 1), totals AS (SELECT quadrant, COUNT(*) AS cells, SUM(total_parcels) AS parcels, SUM(growth_parcels) AS growth_parcels FROM cells GROUP BY quadrant) SELECT t.quadrant, t.cells, IFNULL(p.my_properties, 0) AS my_properties, t.growth_parcels, ROUND(t.growth_parcels / t.cells, 2) AS growth_parcels_per_cell, IFNULL(s.early_growth, 0) AS early_growth, IFNULL(s.ongoing_growth, 0) AS ongoing_growth, IFNULL(s.recently_completed, 0) AS recently_completed FROM totals t LEFT JOIN props p USING (quadrant) LEFT JOIN stages s USING (quadrant) ORDER BY t.quadrant
    - |
      Q: Which Watchlist properties have a lower property-level climate risk than their cell?
      Notes: Watchlist cells are high risk by definition, so these are Watchlist properties with 'Low property risk' (risk_score < 59, the portfolio median). Compare classes, never raw risk_score against k1_crs_median: they are different scores. Expect 47 of the 236 Watchlist properties; 1 Watchlist property is unscored.
      SQL: SELECT p.clip, p.resolved_address, p.risk_score, p.cfl_score, p.tcwi_score, c.k1_crs_median, p.geom FROM `YOUR_PROJECT.YOUR_DATASET.portfolio_risk` p JOIN `YOUR_PROJECT.YOUR_DATASET.growth_h3_r9` c USING (h3) WHERE c.k1_growth_share > 0.013 AND c.k1_crs_median >= 61 AND p.risk_score < 59 ORDER BY p.risk_score
    - |
      Q: What kinds of properties are in my portfolio?
      Notes: Land use comes from parcel_essentials through clip; collapse parcel_essentials to one row per clip first. 930 of the 931 properties match. IrisLandUseCd 163 is SFR and 112 is CONDOMINIUM (see the parcel_essentials instructions).
      SQL: SELECT e.land_use, COUNT(*) AS my_properties FROM `YOUR_PROJECT.YOUR_DATASET.portfolio_risk` p JOIN (SELECT clip, ANY_VALUE(IrisLandUseCd) AS land_use FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` GROUP BY clip) e USING (clip) GROUP BY e.land_use ORDER BY my_properties DESC
    - |
      Q: Find the property with STRAP number 22-47-25-B4-0040I.0010
      Notes: Lee County APNs are STRAP numbers. PclIdIrisFrmtd holds the dashed form users quote ('22-47-25-B4-0040I.0010'); original_apn and apn_parcel_number_unformatted hold it without dashes or dots ('224725B40040I0010'); the 8-digit Folio ID ('10282351') is in alternate_apn and AcctNbr. APNs are unique within this table, so no location filter is needed.
      SQL: SELECT parcel_shape_id, clip, original_apn, PclIdIrisFrmtd, alternate_apn, situs_street_address, situs_city, situs_zip_code, IrisLandUseCd FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` WHERE PclIdIrisFrmtd = '22-47-25-B4-0040I.0010' OR original_apn = '224725B40040I0010'
    - |
      Q: How many single family homes are in each census tract?
      Notes: Single-family is IrisLandUseCd '163' (SFR) - '106' is APARTMENT. Count DISTINCT clip to count properties. Expect 365-2,053 per tract.
      SQL: SELECT tract_geoid, COUNT(DISTINCT clip) AS sfr_properties FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` WHERE IrisLandUseCd = '163' GROUP BY tract_geoid ORDER BY tract_geoid
    - |
      Q: What is the average calculated total value of properties built after 2015 in zip code 34135?
      Notes: Use UnvTotalValAmt (calculated total value) collapsed to one row per clip, and AVG not SUM. situs_zip_code mixes 5-digit and ZIP+4 values, so match with LIKE.
      SQL: SELECT COUNT(*) AS properties, AVG(v) AS avg_value FROM (SELECT clip, ANY_VALUE(UnvTotalValAmt) AS v FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` WHERE situs_zip_code LIKE '34135%' AND YyBltActDt > 2015 GROUP BY clip) t
    - |
      Q: Show me the parcel boundary for CLIP 1004366396
      Notes: geom is native GEOGRAPHY - select it directly, never through ST_GEOGFROMTEXT. A CLIP can span several parcel shapes, so expect one row per shape.
      SQL: SELECT parcel_shape_id, clip, situs_street_address, geom FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` WHERE clip = '1004366396'
    - |
      Q: What is the total parcel acreage in each census tract?
      Notes: Lot size of record is the parcel polygon area, not the assessor LandDimAcresTotal. Compute ST_AREA once per parcel_shape_id, then sum (1 acre = 4046.8564224 sq m). Expect 10,177 acres over 15,325 parcels in total; summing raw rows would give 11,583.
      SQL: SELECT tract_geoid, COUNT(*) AS parcels, SUM(sqm) / 4046.8564224 AS total_acres FROM (SELECT parcel_shape_id, ANY_VALUE(tract_geoid) AS tract_geoid, ST_AREA(ANY_VALUE(geom)) AS sqm FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` GROUP BY parcel_shape_id) t GROUP BY tract_geoid ORDER BY tract_geoid
    - |
      Q: How many properties have an out-of-state owner?
      Notes: Absentee ownership is inferred when the owner's mailing state (StdStCd) differs from the property's situs state; exclude NULL mailing states. Count DISTINCT clip. Expect about 6,100.
      SQL: SELECT COUNT(DISTINCT clip) AS absentee_properties FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` WHERE StdStCd IS NOT NULL AND StdStCd != situs_state
    - |
      Q: How many parcels in each census tract are in a high-risk FEMA flood zone?
      Notes: Special Flood Hazard Areas are zone designations beginning with A or V (this table has A, AE and AH; the rest is X) - match with LIKE; count DISTINCT parcel_shape_id. flood_zone_1 is parcel-grain and never NULL here.
      SQL: SELECT tract_geoid, COUNT(DISTINCT parcel_shape_id) AS parcels, COUNT(DISTINCT IF(flood_zone_1 LIKE 'A%' OR flood_zone_1 LIKE 'V%', parcel_shape_id, NULL)) AS sfha_parcels FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` GROUP BY tract_geoid ORDER BY sfha_parcels DESC
    - |
      Q: Which parcel contains the point -81.803494, 26.365097?
      Notes: Point-in-polygon; the spatial predicate goes in WHERE and the result collapses to one row per parcel. ST_GEOGPOINT takes longitude FIRST.
      SQL: SELECT parcel_shape_id, ARRAY_AGG(clip) AS clips, ANY_VALUE(situs_street_address) AS situs_street_address FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` WHERE ST_CONTAINS(geom, ST_GEOGPOINT(-81.803494, 26.365097)) GROUP BY parcel_shape_id
    - |
      Q: Show parcels larger than 5 acres
      Notes: Lot size from the parcel polygon, one row per parcel_shape_id. The map needs the geometry output named geom, which is also the source column, so filter on the area in an outer query, not in HAVING. Do not filter on LandDimAcresTotal (assessor holding total). The largest parcel is a 180.6-acre golf course.
      SQL: SELECT * EXCEPT (sqm) FROM (SELECT parcel_shape_id, ST_AREA(ANY_VALUE(geom)) AS sqm, ROUND(ST_AREA(ANY_VALUE(geom)) / 4046.8564224, 2) AS parcel_acres, ANY_VALUE(situs_street_address) AS situs_street_address, ANY_VALUE(IrisLandUseCd) AS land_use, ANY_VALUE(geom) AS geom FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` GROUP BY parcel_shape_id) WHERE sqm / 4046.8564224 > 5 ORDER BY parcel_acres DESC
    - |
      Q: What are the top 10% most valuable homes in each census tract?
      Notes: Collapse to one row per clip (taking one tract per clip), rank within tract, and cut with a tie-safe ROW_NUMBER, not PERCENT_RANK. 'Homes' uses the dwelling codes, not the whole 1xx band, whose top value is an $86.7M retirement-village record.
      SQL: WITH homes AS (SELECT clip, ANY_VALUE(tract_geoid) AS tract_geoid, ANY_VALUE(UnvTotalValAmt) AS v FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` WHERE IrisLandUseCd IN ('100', '102', '109', '111', '112', '115', '116', '117', '137', '138', '148', '151', '160', '163', '165') AND UnvTotalValAmt > 0 GROUP BY clip) SELECT clip, tract_geoid, v FROM homes QUALIFY ROW_NUMBER() OVER (PARTITION BY tract_geoid ORDER BY v DESC, clip) <= CEIL(0.10 * COUNT(*) OVER (PARTITION BY tract_geoid)) ORDER BY tract_geoid, v DESC
    - |
      Q: What share of homes in each census tract have a pool?
      Notes: pool_indicator is genuine Y/N and never NULL. Restrict to the dwelling codes and count DISTINCT clip. Expect 29-58% by tract.
      SQL: SELECT tract_geoid, COUNT(DISTINCT clip) AS homes, COUNT(DISTINCT IF(pool_indicator = 'Y', clip, NULL)) AS homes_with_pool, ROUND(100 * COUNT(DISTINCT IF(pool_indicator = 'Y', clip, NULL)) / COUNT(DISTINCT clip), 1) AS pct_with_pool FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` WHERE IrisLandUseCd IN ('100', '102', '109', '111', '112', '115', '116', '117', '137', '138', '148', '151', '160', '163', '165') GROUP BY tract_geoid ORDER BY pct_with_pool DESC
    - |
      Q: What is the average single-family home value by census block group?
      Notes: census_blockgroup_id is only the 1-digit block group number, so build the 12-digit block group GEOID with CONCAT(tract_geoid, census_blockgroup_id); grouping on census_blockgroup_id alone would merge block groups across tracts. Collapse to one row per clip first.
      SQL: SELECT blockgroup_geoid, COUNT(*) AS sfr_properties, ROUND(AVG(v)) AS avg_value FROM (SELECT clip, ANY_VALUE(CONCAT(tract_geoid, census_blockgroup_id)) AS blockgroup_geoid, ANY_VALUE(UnvTotalValAmt) AS v FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` WHERE IrisLandUseCd = '163' GROUP BY clip) t GROUP BY blockgroup_geoid ORDER BY avg_value DESC
    - |
      Q: How many properties in each census tract are in a growth stage?
      Notes: growth_parcels has one row per property and carries tract_geoid, so no join and no DISTINCT are needed. Seven tracts are returned, from 364 properties (12071050318) down to 2 (12071050316); tract 12071050315 has no growth property, so it is absent from the result rather than zero.
      SQL: SELECT tract_geoid, COUNT(*) AS growth_properties FROM `YOUR_PROJECT.YOUR_DATASET.growth_parcels` GROUP BY tract_geoid ORDER BY growth_properties DESC
    - |
      Q: Break down growth properties by stage and type in census tract 12071050318.
      Notes: Filter on g.tract_geoid - no join needed. TRIM type_of_growth because the multi-family value has a trailing space. Expect 10 stage/type rows; Ongoing Growth Vacant Land (113) and Recently Completed Vacant Land (125) are the largest.
      SQL: SELECT growth_stage, TRIM(type_of_growth) AS type_of_growth, COUNT(*) AS properties FROM `YOUR_PROJECT.YOUR_DATASET.growth_parcels` WHERE tract_geoid = '12071050318' GROUP BY 1, 2 ORDER BY 1, 3 DESC
    - |
      Q: Show the Ongoing Growth parcels in census tract 12071050318 on the map.
      Notes: The polygon comes from parcel_essentials; filter the tract on g.tract_geoid (one tract per property). Returns 120 rows - 120 properties on 120 parcels. A parcel shared by several growth properties would appear once per property with the same polygon.
      SQL: SELECT p.parcel_shape_id, g.clip, g.growth_stage, TRIM(g.type_of_growth) AS type_of_growth, g.recent_new_con_bldg_permit_effective_date, p.situs_street_address, p.geom FROM `YOUR_PROJECT.YOUR_DATASET.growth_parcels` g JOIN `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` p ON p.clip = g.clip WHERE g.growth_stage = 'Ongoing Growth' AND g.tract_geoid = '12071050318'
    - |
      Q: Which builder/developer-owned properties had a new construction building permit in the last two years? Show the address.
      Notes: Both flags are on growth_parcels; the address comes from parcel_essentials and is property (CLIP)-grain, so SELECT DISTINCT without the geometry gives one row per property. Returns 8 properties, all Ongoing Growth; permit dates run from 20241121 to 20260922.
      SQL: SELECT DISTINCT g.clip, p.situs_street_address, p.situs_city, g.growth_stage, g.recent_new_con_bldg_permit_effective_date FROM `YOUR_PROJECT.YOUR_DATASET.growth_parcels` g JOIN `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` p ON p.clip = g.clip WHERE g.builder_developer_ownership_indicator = 'Y' AND g.recent_new_con_bldg_permit_indicator = 'Y' ORDER BY g.recent_new_con_bldg_permit_effective_date DESC
    - |
      Q: What is the average number of nearby new-construction properties by growth type in ZIP 34135?
      Notes: The ZIP comes from parcel_essentials (situs_zip_code mixes 5-digit ZIPs and ZIP+4, so match with LIKE). Nearby counts overlap between neighbours, so average them (never SUM) on one row per clip - the inner SELECT DISTINCT collapses the join. The count is populated only on properties with a recent new construction sale, so report how many properties carry it: 795 growth properties in the ZIP, 204 with a count (Vacant Land 141 of 443, average 162.7; Single Family Residential 32 of 218, average 189.9; Multi-Family 31 of 121, average 118.8); Commercial and Other have none.
      SQL: SELECT TRIM(type_of_growth) AS type_of_growth, COUNT(*) AS properties, COUNT(nearby) AS properties_with_count, ROUND(AVG(nearby), 1) AS avg_nearby_new_construction, MAX(nearby) AS max_nearby_new_construction FROM (SELECT DISTINCT g.clip, g.type_of_growth, g.recent_nearby_new_construction_cnt AS nearby FROM `YOUR_PROJECT.YOUR_DATASET.growth_parcels` g JOIN `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` p ON p.clip = g.clip WHERE p.situs_zip_code LIKE '34135%') t GROUP BY 1 ORDER BY 2 DESC
    - |
      Q: What share of properties in each census tract is in a growth stage?
      Notes: growth_parcels holds only properties in a growth stage, so the denominator is COUNT(DISTINCT p.clip) from parcel_essentials with a LEFT JOIN to growth. Shares run from 0% (12071050315) to 9.8% (12071050401, 287 of 2,925). Grouping on p.tract_geoid counts each of the 2 properties that straddle two tracts in both of them (one is a growth property), so the columns sum to 21,449 and 919, and 12071050401 shows one more growth property than its g.tract_geoid count of 286.
      SQL: SELECT p.tract_geoid, COUNT(DISTINCT p.clip) AS properties, COUNT(DISTINCT g.clip) AS growth_properties, ROUND(100 * COUNT(DISTINCT g.clip) / COUNT(DISTINCT p.clip), 1) AS pct_in_growth FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials` p LEFT JOIN `YOUR_PROJECT.YOUR_DATASET.growth_parcels` g ON g.clip = p.clip GROUP BY 1 ORDER BY 1
  datasets:
  - name: portfolio_risk
