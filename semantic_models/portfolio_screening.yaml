    - name: flood_zone_1
      label: Intelligence
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: flood_zone_1
      description: 'FEMA flood zone designation covering the largest portion of the parcel. Zone families: designations
        beginning with A or V are Special Flood Hazard Areas (1% annual-chance flood; V zones add coastal wave hazard);
        B, C and X are moderate-to-minimal risk; D is undetermined. Match zone families with LIKE (e.g., LIKE ''A%'')
        because sub-designations such as AE, AH or A99 occur - the legacy numbered zones A1-A30 and V1-V30 are equivalents
        of AE and VE and are already caught by those patterns. The moderate band includes shaded X variants such
        as X500. In this study table it is never NULL and holds X (15,695 rows), AE (5,724), AH (163) and A (10);
        no V zones occur. Parcel-shape-grain: it can differ among the parcels of one multi-parcel property, so count
        flood exposure with COUNT(DISTINCT parcel_shape_id). Detailed metrics for the top 5 flood zone types and
        sub-types are available in the Parcel Terrain product, not here.'
      ai_context:
        synonyms:
        - flood zone
        - FEMA flood zone
        instructions: 'BigQuery type: STRING. Common filter column. Value groups: high risk sfha (Special Flood
          Hazard Area (1% annual-chance flood) - zones beginning with A or V): sample codes ''A'', ''AE'', ''AH'',
          ''AO'', ''V'', ''VE''; moderate low risk (Moderate to minimal flood risk): sample codes ''B'', ''C'',
          ''X''; undetermined (Flood risk not determined): sample codes ''D''. FEMA zone designations; use LIKE
          for zone families since sub-designations occur.'
