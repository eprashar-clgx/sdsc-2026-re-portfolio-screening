        ''12071050318''. Added to this study extract; not in the production Parcel Essentials table. Never NULL
        and equal to fips || census_tract_id on every row. Eight values: ''12071050315'', ''12071050316'', ''12071050317'',
        ''12071050318'', ''12071050401'', ''12071050502'', ''12071050601'', ''12071050603''. The primary sub-area
        and grouping key in this table, and the key for joining tract-level data. Parcel-shape-grain: 2 properties
        span parcels in two tracts, so take ANY_VALUE(tract_geoid) per clip when grouping property measures by tract.'
      ai_context:
        synonyms:
        - census tract
        - tract geoid
        - census tract geoid
        - tract
        - neighborhood
        instructions: 'BigQuery type: STRING. Common filter column. Group block groups by CONCAT(tract_geoid, census_blockgroup_id).'
    - name: census_tract_id
      label: Intelligence
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: census_tract_id
      description: 2020 Census tract code, a small statistical subdivision of a county defined by the US Census
        Bureau. Only the 6-digit tract code (e.g. '050318'), unique within a county but not nationally - use tract_geoid
        for the full GEOID and for grouping or joins.
      ai_context:
        synonyms:
        - census tract code
        instructions: 'BigQuery type: STRING.'
    - name: census_blockgroup_id
      label: Intelligence
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: census_blockgroup_id
      description: 2020 Census block group, a cluster of census blocks within a tract that shares demographic characteristics.
        Holds ONLY the 1-digit block group number within the tract ('1'-'4'), not a GEOID - the same value repeats
        in every tract. Build the 12-digit block group GEOID with CONCAT(tract_geoid, census_blockgroup_id) (23
        block groups in this table) and never group on this column alone.
      ai_context:
        synonyms:
        - census block group
        - block group
        instructions: 'BigQuery type: STRING.'
    - name: school_district
      label: Intelligence
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: school_district
      description: Name of the school district in which the parcel is located. 'Lee County School District' on every
        row of this study table.
      ai_context:
        synonyms:
        - school district
        instructions: 'BigQuery type: STRING.'
    - name: address_count
      label: Intelligence
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: address_count
      description: Count of unique addresses associated with the property. Detailed address-level information is
        available in the Address Connect product, not here. Property (CLIP)-grain value - repeats on every row sharing
        the same clip; dedupe on clip before aggregating.
      ai_context:
        instructions: 'BigQuery type: INT64. Numeric measure, unit: count.'
    - name: primary_business_use_indicator
      label: Intelligence
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: primary_business_use_indicator
      description: 'Proprietary rules-based indicator distinguishing dedicated business premises (retail storefronts,
        offices, manufacturing facilities) from addresses not primarily used for business (e.g., home-based businesses).
        When multiple linked CLIPs disagree, T wins if any record is T. NOTE: source lineage for this field lists
        no BQ project/dataset, only the source view name - confirm the physical source before relying on freshness/refresh
        cadence.'
      ai_context:
        synonyms:
        - business use
        - commercial use indicator
        instructions: 'BigQuery type: STRING. Flag column. Common filter column. Value groups: business (Dedicated
          business premises): ''T''; not business (Not primarily used for business): ''F''.'
    - name: composite_risk_score
      label: Intelligence
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: crs
      description: 'Composite risk value from 1 to 100, based on combined average annual loss rates for multiple
        perils (earthquake, wildfire, inland flood, severe convective storms, winter storms, storm surge, hurricane
        wind) relative to all residential properties nationwide. A value of 1 means perils are modeled but there
        is no risk. NULL means insufficient data to determine the perils for this property - NULL is NOT equivalent
        to a low score and must not be treated as 0 or excluded silently. This is a score, not an additive quantity
        - use AVG or MAX, never SUM. In this study table it ranges 3-100 and is NULL on 20% of properties. Property
        (CLIP)-grain value - repeats on every row sharing the same clip; dedupe on clip before aggregating. Business
        field name in the product spec: COMPOSITE RISK SCORE.'
      ai_context:
        synonyms:
        - risk score
        - hazard risk
        instructions: 'BigQuery type: INT64. Numeric measure, unit: score_1_100.'
    - name: event_record_date
      label: Intelligence
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: event_record_date
      description: Date of the parcel lineage/change event. When multiple linked records exist, the most recent
        (maximum) date is used. Delivered as a string (YYYY-MM-DD), not a native DATE type - cast/parse before doing
        date arithmetic. NULL on 92% of rows in this study table (populated values run from 2021-01-13 to 2026-01-19).
      ai_context:
        instructions: 'BigQuery type: STRING.'
    ai_context:
      synonyms:
      - parcel essentials
      - parcel essentials study
      - study area parcels
      - parcels
      - parcel data
      - property parcels
      - Bonita Springs parcels
      - Estero parcels
      instructions: |
        STUDY AREA: this table is not nationwide. Every row is in Lee County, FL (fips = '12071', statecode = '12', countycode = '071' and CntyCd = '12071' on every row) and in one of eight 2020 Census tracts, tract_geoid IN ('12071050315', '12071050316', '12071050317', '12071050318', '12071050401', '12071050502', '12071050601', '12071050603'), covering Bonita Springs and Estero (parcel centroids span longitude -81.842 to -81.748 and latitude 26.317 to 26.420). A question about any other state, county, city or tract has no rows here - say that the data covers only this study area rather than returning an empty result as if nothing matched. Questions about "the study area", "the county" or "all parcels" need no geographic filter.
        GRAIN: one row per (parcel_shape_id, clip) pair - verified unique. parcel_shape_id identifies a parcel polygon and clip identifies a property; neither is ever NULL in this table (it holds no parcel-only rows). The relationship is many-to-many at the margins: 1,003 of 15,325 parcels (6.5%) carry more than one clip (condo buildings - up to 64 units on one polygon) and 50 of 21,447 clips (0.2%) span more than one parcel (up to 34). COUNT(*) counts pairs, not properties or parcels: for "how many properties" use COUNT(DISTINCT clip), for "how many parcels" use COUNT(DISTINCT parcel_shape_id), and say which one you used.
        Joins to portfolio_risk, growth_parcels and growth_h3_r9 are defined in the model-level JOINS instructions; for any other join, confirm the key and cardinality with the user first - do not assume `clip` is safe to join 1:1. tract_geoid is the standard 11-digit Census tract GEOID (state + county + tract), so it is the key for tract-level data; one tract matches between 1,787 and 4,507 rows here.
        GEOMETRY: geom is a native GEOGRAPHY column (EPSG:4326); every value is a single POLYGON. Pass it straight to ST_AREA, ST_CONTAINS, ST_INTERSECTS and the other ST_ functions, and never wrap it in ST_GEOGFROMTEXT (that fails with "No matching signature"). Use ST_ASTEXT(geom) only when WKT text output is explicitly wanted. Use tract_geoid for census geography.
        TABLE AND COLUMNS READ: in SQL, reference the table by its full name, `YOUR_PROJECT.YOUR_DATASET.parcel_essentials`. It is small (21,592 rows), so cost is not a concern, but still select only the columns the answer needs, and reference geom (which holds most of the table's bytes) only for boundary, area, map or spatial questions.
        SUB-AREA SELECTION: select within the study area by
          census tract:  tract_geoid = '12071050318'
          block group:   CONCAT(tract_geoid, census_blockgroup_id) = '120710503181'
          ZIP:           situs_zip_code LIKE '34135%'   (see ADDRESS FIELDS)
          city:          situs_city = 'ESTERO'          (see ADDRESS FIELDS)
          drawn area:    a spatial predicate            (see SPATIAL PREDICATES)
        fips, statecode, countycode and CntyCd each hold one value and never narrow anything. clip and parcel_shape_id identify rows across the whole table, so an id lookup needs no location filter. APNs are unique within this table (one per property) - see original_apn for the Lee County STRAP and Folio ID forms.
        CENSUS GEOGRAPHY: tract_geoid is the full 11-digit tract GEOID; census_tract_id is only the 6-digit tract code (tract_geoid = fips || census_tract_id on every row). census_blockgroup_id is only the 1-digit block group number within the tract ('1'-'4'), NOT a GEOID - group block groups by CONCAT(tract_geoid, census_blockgroup_id) (23 block groups here), never by census_blockgroup_id alone, which merges block groups across tracts. All three are parcel-shape-grain (they differ among the shapes of 2 multi-parcel properties). SitusCensID comes from the property record in a different census vintage: its tract prefix disagrees with census_tract_id on 4.6% of rows and shows 26 distinct tracts, so never use it for tract or block group grouping. There is no tract polygon column - for a tract map, join tract boundaries on tract_geoid, or aggregate one geometry per parcel_shape_id with ST_UNION_AGG as an approximate footprint.
        SPATIAL PREDICATES: put a spatial predicate against a constant geography (a point, a WKT literal or a drawn polygon) - ST_CONTAINS, ST_INTERSECTS, ST_COVERS, ST_WITHIN, ST_DWITHIN, or ST_DISTANCE(...) <= r - directly in WHERE, and collapse to the parcel when one row per parcel is wanted:
          SELECT parcel_shape_id, ARRAY_AGG(clip) AS clips
          FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials`
          WHERE ST_CONTAINS(geom, ST_GEOGPOINT(-81.803494, 26.365097))
          GROUP BY parcel_shape_id
        For an approximate radius search on the centroid point, use ST_DWITHIN(ST_GEOGPOINT(CAST(parcel_longitude AS FLOAT64), CAST(parcel_latitude AS FLOAT64)), <point>, <meters>), which reads the two coordinate columns instead of the polygon column.
        LOCATION PRECEDENCE: boundary and map questions use geom. When only a representative point is needed, use parcel_longitude / parcel_latitude (NUMERIC; verified inside the polygon for all 15,325 parcels, median 0.45 m from ST_CENTROID). location_longitude / location_latitude is an alternate, property (CLIP)-grain point that falls outside the polygon for 148 parcels (1.0%) and differs among the clips of 12 shared parcels. Cast the NUMERIC coordinates to FLOAT64 for ST_GEOGPOINT, longitude first. The geohash columns are informational only - never use them in spatial predicates.
        VALUE TRIADS: tax/value fields come in four parallel families - CALCULATED (UnvTotalValAmt / UnvLandValAmt / UnvImpvValAmt), ASSESSED (Assd*), MARKET (Mkt*), and APPRAISED (Appr*). In this table UnvTotalValSourceInd and UnvLandValSourceInd are 'M' on every row and UnvTotalValAmt equals MktTotalValAmt on every property where it is populated, so the calculated family is the market family here. The APPRAISED family is entirely NULL. Default to UnvTotalValAmt for "what is this property worth" questions. Question intent routes the family: "tax bill" / "assessed" / "taxable" -> Assd* (Florida assessed value, capped for homesteads, is below market on 70% of properties that have both - median 83% of market); "market value" and everything else -> UnvTotalValAmt; "appraised" -> say appraised values are not populated in this table. NEVER COALESCE across value families - they are on different scales - and never mix families in one comparison. UnvTotalValAmt is NULL on 3.4% of properties and below $1,000 on 254 (common areas and similar non-dwelling records, none of them condos or SFRs).
        SIZE FIELDS: there are many overlapping square-footage columns (universal building, building area, living area, ground floor, gross, adjusted, basement, garage). Default to UnvBldgSqFtTotalNbr (universal building square feet) for general "how big is the building" questions - it is the field explicitly designed to hold the best-available figure; the others are specific breakdowns and are not interchangeable with it or with each other. Here it is on the living-area basis (UnvBldgSqFtTotalInd = 'L') for 82% of rows and BsmtSqFtNbr is entirely NULL.
        ADDRESS FIELDS: the raw parcel-address columns (parcel_address, city, state, zipcode) hold the address as received from the source - note their generic names; the situs_* columns are the standardized version of the same address. Use situs_* for address search and display: the raw street differs from the situs street on 39% of rows, and situs_city is ESTERO on 5,126 rows while the raw city is ESTERO on only 945. situs_city values are BONITA SPRINGS, ESTERO and NAPLES (Lee County addresses in Naples ZIP 34110), plus a stray 'BONITA SPGS' (1 row) and 'NORTH FORT MYERS' (2 rows), so match Bonita Springs with situs_city LIKE 'BONITA SP%'. zipcode is always 5 digits; situs_zip_code and StdZipCd mix 5-digit ZIPs and 9-digit ZIP+4 values (91% of situs ZIPs are ZIP+4), so match a ZIP with LIKE '34135%' or SUBSTR(situs_zip_code, 1, 5). Situs ZIPs: 34135 (17,441 rows), 34134 (2,765), 33928 (941), 34110 (403), and a few stray rows in other ZIPs. The owner mailing city, state and ZIP (StdCityName / StdStCd / StdZipCd) are not necessarily the property location - the mailing state is not FL for 6,101 properties (seasonal and absentee owners). Owner names and the owner mailing street are not in this table.
        AGGREGATION AND DEDUPLICATION: because the grain is many-to-many, attribute values repeat across rows. Property (CLIP)-grain attributes - all valuation and tax fields, building/structure characteristics, owner fields, the assessor lot fields (LandDimAcresTotal, LandDimSqFtTotal, LandDimFrontNbr, LandDimDepthNbr), the location_* point, PLSS fields, address_count and crs - repeat once per parcel shape the property touches. Parcel-shape-grain attributes - geom (and the polygon area derived from it), the parcel centroid point, the source/update dates, flood_zone_1, tract_geoid, census_tract_id and census_blockgroup_id - repeat once per property on the shape. Every column tested was constant within its key, so collapse to the right key BEFORE SUM or AVG with GROUP BY plus ANY_VALUE, not SELECT DISTINCT:
          SELECT clip, ANY_VALUE(UnvTotalValAmt) AS v ... GROUP BY clip
          SELECT parcel_shape_id, ANY_VALUE(geom) AS geom ... GROUP BY parcel_shape_id
        SELECT DISTINCT cannot be used on GEOGRAPHY at all, and SELECT DISTINCT key, <column> double-counts whenever the column differs within a key. Summing over raw rows double-counts: the raw-row sum of polygon area is 11,583 acres against 10,177 acres once collapsed per parcel. COUNT(DISTINCT clip) and COUNT(DISTINCT parcel_shape_id) are already safe. When grouping a property measure by tract, take one tract per clip with ANY_VALUE(tract_geoid) - 2 properties straddle two tracts. Map layers need the geometry output named geom, which is also the source column. Do not combine that alias (ANY_VALUE(geom) AS geom) with HAVING: BigQuery resolves geom inside HAVING to the alias and fails with "Aggregations of aggregations are not allowed". Filter on the aggregate in an outer query instead (SELECT * FROM (...) WHERE ...).
        TWO GRAINS IN ONE ANSWER: when one question needs a parcel measure AND a property measure (e.g. acreage and value by census tract), build one CTE per grain from this table and join them on the group key - a single CTE at either grain repeats the other family's values:
          WITH parcel_area AS (
            SELECT parcel_shape_id, ANY_VALUE(tract_geoid) AS tract_geoid, ST_AREA(ANY_VALUE(geom)) AS sqm
            FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials`
            GROUP BY parcel_shape_id),
          clip_value AS (
            SELECT clip, ANY_VALUE(tract_geoid) AS tract_geoid, ANY_VALUE(UnvTotalValAmt) AS v
            FROM `YOUR_PROJECT.YOUR_DATASET.parcel_essentials`
            GROUP BY clip),
          tract_area AS (SELECT tract_geoid, SUM(sqm) / 4046.8564224 AS acres FROM parcel_area GROUP BY tract_geoid),
          tract_value AS (SELECT tract_geoid, SUM(v) AS total_value FROM clip_value GROUP BY tract_geoid)
          SELECT a.tract_geoid, a.acres, v.total_value
          FROM tract_area a JOIN tract_value v USING (tract_geoid)
          ORDER BY a.tract_geoid

        LOT SIZE: the lot size of record is the parcel polygon area, computed once per parcel_shape_id as
          ST_AREA(ANY_VALUE(geom)) / 4046.8564224 AS parcel_acres
        (square meters: ST_AREA(...); square feet: ST_AREA(...) / 0.09290304). Use it for every lot-size filter, ranking and total, and filter on the same expression in HAVING. Parcels here run from a median of 0.22 acres up to 180.6 acres (a golf course), 10,177 acres in total. LandDimAcresTotal / LandDimSqFtTotal are assessor values from the property record, not the polygon. For a property on exactly one parcel they agree closely with the polygon (median ratio 1.00, within 10% for 98.8% of such properties). They diverge where the grain does: a property spanning several parcels carries its whole-holding total on every parcel row, and condo units on a shared parcel each carry the full parcel acreage (99% of unit rows on shared parcels), so summing them over units multiplies the parcel's area. No cap or sentinel values occur in this table (maximum 255.8 acres). Use the assessor figures only when the user asks for the assessor/county figure, and say in the answer that it is the assessor's figure.
        NO SPATIAL SELF-JOINS: the parcel-to-property link is already on every row (parcel_shape_id, clip). Never derive it with ST_INTERSECTS or ST_CONTAINS between two copies of this table - that is slow and adds false matches between neighbouring parcels that share a boundary. For random samples, collapse to the grain first (GROUP BY parcel_shape_id or clip) and apply ORDER BY RAND() LIMIT n to that result, never to a joined row set.
        TOP-SHARE CUTS: for "top 10%" style questions, collapse to one row per clip and cut with a tie-safe ROW_NUMBER within the group the user names (the census tract when they say "each area" or "each neighborhood"):
          QUALIFY ROW_NUMBER() OVER (PARTITION BY tract_geoid ORDER BY v DESC, clip)
                  <= CEIL(0.10 * COUNT(*) OVER (PARTITION BY tract_geoid))
        PERCENT_RANK() <= 0.10 lets ties push the share over the target.
        NON-ADDITIVE VALUES: crs (composite risk score), TaxTotalRatePct (tax rate percent - entirely NULL in this table), and the year fields (YyBltActDt, YyBltEffDt, TotalTaxBegYY, AssdYr) are scores, rates or years - aggregate with AVG, MIN or MAX only, never SUM. TotalTaxBegYY and AssdYr are 2025 on every populated row.
        NULL VALUES AND COVERAGE: 21 columns are entirely NULL in this table - ApprTotalValAmt, ApprLandValTotal, ApprImpvValTotal, NetTaxAmt, TaxTotalRatePct, TaxableOtherTotal, QTRSectionCd, UnvElectCd, UnvSewerCd, UnvWaterCd, BsmtSqFtNbr, SumNbrRm, SumNbrBath1Qtr, SumNbrBath3Qtr, BathFixtNbr, SumNbrBathFixtures, UnvBsmtFinCd, UnvBldgImpvCd, UnvFoundationCd, prkgspaces and UnvStyleCd. A question that depends on one of them cannot be answered from this table - say so instead of filtering on it. The other building-characteristic columns come from the county assessor and are NULL where it does not record them: year built, building square feet, bedrooms and bathrooms are NULL on 12-18% of properties and crs on 20%. Never treat NULL as zero or as a negative finding. When a characteristic filter (e.g., SumNbrBdrm >= 3) returns zero rows, report that the attribute is not populated rather than "no properties match" - those are different answers. When such a filter returns rows, note that NULL rows were excluded, not disqualified.
        BATHROOM FILTERS: bathroom counts are split across columns. Here BathNbrTotal and SumNbrBath are each populated on about 85% of properties, but BathNbrTotal carries half baths as fractions (non-whole on 2,552 properties) while SumNbrBath counts a half bath as a whole room, so the two differ on 2,674 properties. For bathroom threshold filters use the fallback chain COALESCE(BathNbrTotal, SumNbrBathFull + 0.5 * COALESCE(SumNbrBathHalf, 0), SumNbrBath) >= n, never SumNbrBath alone. Use SumNbrBathFull / SumNbrBathHalf directly only when the user asks for a full-vs-half breakdown. BathFixtNbr and SumNbrBathFixtures are entirely NULL here.
        INDICATOR ENCODING (verified on this table): FireplInd (928 'Y' rows), MobileHomeInd (1,334 'Y') and AddrOptSourceCd (182 'Y') use presence encoding - the only populated value is 'Y'; NULL means not indicated, and no 'N' value exists, so WHERE FireplInd = 'N' matches nothing (use IS NULL for the negative case, stated as 'not indicated'). pool_indicator is genuine Y/N and is never NULL (7,686 'Y' rows). primary_business_use_indicator is T/F and is never NULL. The five *_proximity_label columns are INT64 0/1 and are never NULL.
        CODE COLUMNS: the Unv*Cd code columns (view, construction, heating, roof, quality, etc.) describe and qualify results well, but many are sparse here - UnvStyleCd is entirely NULL, UnvFlrCd is 99% NULL, UnvCnstrCd and UnvFrameCd 97%, UnvViewCd 90%, UnvCondCd 85% - so a hard WHERE filter on them silently returns a small, biased subset. Prefer them in SELECT for display and qualification; the reliably filterable classification column is IrisLandUseCd (never NULL here).
        LAND USE FILTER IS MANDATORY FOR HOMES: this table contains every property type - commercial, industrial, vacant land, golf courses and government land included - so any question about homes, houses, residences, or places to live must carry an IrisLandUseCd filter. IrisLandUseCd is always a 3-digit string and is never NULL here (74 distinct codes). The residential band '100'-'199' is broader than "homes": here it also holds a nursing home (157), an orphanage (156), a hotel (127), a motel (142), transient lodging (164) and whole apartment buildings (131, 132, 133, 134). Unfiltered, the most valuable "home" in the band is an $86.7M retirement-village record (157), followed by three apartment complexes (131). For homes / houses use IrisLandUseCd IN ('100', '102', '109', '111', '112', '115', '116', '117', '137', '138', '148', '151', '160', '163', '165'); the codes present here are 163 SFR (8,351 properties), 112 CONDOMINIUM (7,644), 137 MOBILE HOME (1,320), 100 RESIDENTIAL NEC (346), 111 COOPERATIVE (178), 138 MANUFACTURED HOME (13) and 115 DUPLEX (1). Single-family is '163' (SFR) - '106' is APARTMENT, not single-family. Use the whole BETWEEN '100' AND '199' band only for "residential property" questions in the broad sense.
        GROUPING: the natural sub-area unit is the census tract (tract_geoid), then the block group (CONCAT(tract_geoid, census_blockgroup_id)); situs ZIP and situs_city also work. A GEOGRAPHY value cannot appear in GROUP BY or SELECT DISTINCT in BigQuery - group on parcel_shape_id and carry ANY_VALUE(geom) instead.
        DELTA FILES: this table is a current-state snapshot and has no delta action indicator column (no record_action_indicator or record_flag).
  relationships:
  - name: portfolio_to_cell
    from: portfolio_risk
    to: growth_h3_r9
    from_columns:
    - h3
    to_columns:
    - h3
    ai_context: Many properties to one cell. 930 of 931 properties match; the other lies in an excluded cell. A
      property takes its cell's growth class, risk class and quadrant.
  - name: growth_parcel_to_cell
    from: growth_parcels
    to: growth_h3_r9
    from_columns:
    - h3
    to_columns:
    - h3
    ai_context: Many growth properties to one cell; 913 of 918 match. growth_h3_r9.growth_parcels equals the number
      of matching growth_parcels rows.
  - name: portfolio_to_parcel_essentials
    from: portfolio_risk
    to: parcel_essentials
    from_columns:
    - clip
    to_columns:
    - clip
    ai_context: One portfolio property to one or more parcel_essentials rows (one per parcel shape). Collapse parcel_essentials
      to one row per clip before joining. 930 of 931 match.
  - name: parcel_essentials_to_growth_indicators
    from: parcel_essentials
    to: growth_parcels
    from_columns:
    - clip
    to_columns:
    - clip
    ai_context: |
      Many parcel_essentials rows to one growth_parcels row, and most parcel_essentials properties have no growth row. Both clip columns are 10-digit STRINGs, so the join is p.clip = g.clip with no CAST. Verified 2026-10-14: all 918 growth properties match a parcel_essentials clip (none unmatched), on 869 parcel shapes; the join returns 919 rows because one property (clip 5167985792) spans two parcel shapes, and 25 parcels carry three growth properties each. In the other direction, 918 of the 21,447 parcel_essentials properties (4.3%) have a growth row; the other 20,529 were in no growth stage in the release the growth table was cut from.
  metrics:
  - name: portfolio_property_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT portfolio_risk.clip)
    description: Number of the user's properties.
  - name: cell_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT growth_h3_r9.h3)
    description: Number of H3 cells.
  - name: cell_total_parcels
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(growth_h3_r9.total_parcels)
    description: Parcels in a set of cells (sum over distinct cells).
  - name: cell_growth_parcels
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(growth_h3_r9.growth_parcels)
    description: Growth parcels in a set of cells (sum over distinct cells; never sum k1_growth_parcels).
  - name: pooled_growth_share
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(growth_h3_r9.growth_parcels) / SUM(growth_h3_r9.total_parcels)
    description: Growth share of a set of cells - not AVG(growth_share).
  - name: growth_parcels_per_cell
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(growth_h3_r9.growth_parcels) / COUNT(DISTINCT growth_h3_r9.h3)
    description: Average growth parcels per cell in a set of cells.
  - name: avg_property_risk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(portfolio_risk.risk_score)
    description: Average all-perils climate risk score of a set of the user's properties (unscored excluded).
  - name: property_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT parcel_essentials.clip)
    description: Number of distinct properties (CLIPs). Use it instead of COUNT(*), which counts (parcel_shape_id,
      clip) pairs.
    ai_context:
      synonyms:
      - number of properties
      - property count
  - name: parcel_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT parcel_essentials.parcel_shape_id)
    description: Number of distinct parcel shapes. Use it instead of COUNT(*), which counts (parcel_shape_id, clip)
      pairs.
    ai_context:
      synonyms:
      - number of parcels
      - parcel count
  - name: growth_property_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT growth_parcels.clip)
    description: Number of distinct growth properties (clip). Use it instead of COUNT(*) on a join with parcel_essentials,
      which can return several rows per property.
    ai_context:
      synonyms:
      - number of growth properties
      - growth property count
