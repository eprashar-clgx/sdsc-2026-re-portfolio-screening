# growth_indicators_v2_carto_sdsc_study.yaml
# OSI v0.1.1 (Apache Ossie) semantic model for a CARTO AI Agent, using the CARTO spatial
#   vendor extension (vendor_name: CARTO) instead of the COTALITY extension.
# Adapted from growth_indicators_v2_carto.yaml (the CARTO model of the nationwide production
#   growth view) for the SDSC growth study extract. Growth field definitions, value groups and
#   units are carried over; the parcel_essentials fields (the same 44 as the original plus
#   tract_geoid) and the parcel dataset instructions are copied verbatim from
#   parcel_essentials_carto_sdsc_study.yaml. Every count, range, coverage figure and example
#   was re-measured on the study tables.
# growth_indicators source: clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_growth_study
#   (918 rows, one per property; 31 columns; about 115 KB; no geometry).
# parcel_essentials source: clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_essentials_study
#   (21,592 rows: 15,325 parcels, 21,447 properties).
# CARTO connection for both: clgx-gis-app-dev.
# Verified against both tables on 2026-10-14; every example SQL was executed on that date.
# What defines the growth table (verified 2026-10-14 on clgx-idap-bigquery-prd by
#   full-row fingerprint comparison): every row of production release
#   edr_ent_property_enriched_hist.edr_panoramiq_growth_indicators_v2_3171 (identical to
#   _3172 in this area) whose puid is a CLIP that the production Parcel Essentials table places
#   in Lee County, FL (fips = '12071') census tracts 050315, 050316, 050317, 050318, 050401,
#   050502, 050601 and 050603 - the same 21,447 CLIPs as the parcel study table. puid was
#   renamed clip
#   (INT64 -> 10-digit STRING) and tract_geoid was added. No growth-attribute filter was
#   applied: all 918 rows equal the release rows value for value. It is a snapshot - the
#   view now reads release _3173 (built 2026-10-14 08:49 UTC, after this table), which has
#   919 growth properties in the area (adds clip 1090007397, permit dated 20260930) and
#   recent_new_con_bldg_permit_cnt 0-3 higher on most rows.
version: "0.1.1"

semantic_model:
  - name: growth_indicators_v2_study
    description: >
      Cotality Growth Intelligence v2 growth indicators for the SDSC study area - eight 2020
      Census tracts of southern Lee County, Florida (Bonita Springs and Estero) - paired with
      Parcel Essentials for location. growth_indicators holds one row per property that shows
      growth activity (918 of the area's 21,447 properties) - growth stage, growth type,
      recent-activity flags and nearby-activity counts - keyed by clip, with the property's
      census tract (tract_geoid). It has no geometry, address, owner or land use, so
      parcel_essentials supplies the parcel polygon, address, owner, land use and lot size
      through the relationship p.clip = g.clip.
    ai_context:
      synonyms:
        - "growth intelligence"
        - "growth indicators"
        - "parcel growth"
        - "property growth indicators"
        - "development activity"
        - "growth study"
      instructions: >
        TABLES: in SQL use the full names - growth_indicators is
        `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_growth_study` (918 rows, one per
        property) and parcel_essentials is
        `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_essentials_study` (21,592 rows).

        STUDY AREA: both tables cover only the same eight 2020 Census tracts of Lee County, FL
        (fips 12071 - Bonita Springs and Estero): tract_geoid IN ('12071050315',
        '12071050316', '12071050317', '12071050318', '12071050401', '12071050502',
        '12071050601', '12071050603'). Questions about "the study area", "the map area" or
        "all properties" need no geographic filter. A question about any other state,
        county, city or tract has no rows here - say that the data covers only this study
        area rather than reporting that nothing matched.

        JOIN: growth_indicators has no geometry, address, owner, land use or lot size, so
        maps and address, ZIP, city, owner, land-use, block-group and spatial questions need:
          FROM `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_growth_study` g
          JOIN `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_essentials_study` p ON p.clip = g.clip
        Both clip columns are 10-digit STRINGs, so no CAST is needed. All 918 growth
        properties match a parcel_essentials clip (verified 2026-10-14), so an INNER JOIN
        drops none of them. The join returns 919 rows because one property (clip
        5167985792) spans two parcel shapes, and 25 parcels carry three growth properties
        each: count properties with COUNT(DISTINCT g.clip), count parcels with
        COUNT(DISTINCT p.parcel_shape_id), and collapse to one row per clip before AVG of a
        growth column.

        PROPERTIES WITHOUT A GROWTH ROW: 20,529 of the 21,447 properties in
        parcel_essentials (95.7%) have no growth_indicators row. Absence means the property
        was in no growth stage in the production release the table was cut from (built
        2026-10-11) - it is not missing data and not an unknown stage, so describe those
        properties as "not in a growth stage". For shares of all properties take the
        denominator from parcel_essentials, with a LEFT JOIN to growth_indicators. The table
        is a fixed extract: a property that entered a growth stage after that release is not
        in it.

        GEOGRAPHY FILTERS: filter a census tract with g.tract_geoid, which needs no join (see
        CENSUS TRACTS). ZIP, city, block-group and drawn-area filters use parcel_essentials
        columns through the join, in the forms given in the parcel_essentials SUB-AREA
        SELECTION instructions.

        CENSUS TRACTS: g.tract_geoid is the property's 11-digit tract GEOID and agrees with
        p.tract_geoid for all 918 properties (for clip 5167985792, whose two parcel shapes lie
        in tracts 12071050401 and 12071050502, it holds 12071050502), so tract filters and
        per-tract growth counts need no join: WHERE g.tract_geoid = '12071050318'. When a
        question also needs parcel columns, filter and group on g.tract_geoid for one tract
        per property; p.tract_geoid is parcel-grain and puts clip 5167985792 in both of its
        tracts. Tract 12071050315 has no growth property. Block groups exist only in
        parcel_essentials: CONCAT(p.tract_geoid, p.census_blockgroup_id).

        WORKSHOP SCOPE: the workshop map's data source and both tables cover the same eight
        tracts, so SQL needs no tract filter to match the map area. Filter only when the user
        names a tract, block group, ZIP, city or drawn area.

        COLUMNS READ: both tables are small (about 115 KB and 50 MB) and no filter narrows
        what BigQuery reads, so cost is not a concern. Still select only the columns the
        answer needs, and reference p.parcel_geometry_wkt only for maps, boundaries or
        spatial tests.

        MAPS: to show growth properties on the map, select p.parcel_geometry_wkt (the parcel
        polygon) with the growth attributes; for points use
        ST_GEOGPOINT(CAST(p.parcel_longitude AS FLOAT64), CAST(p.parcel_latitude AS FLOAT64)).
        A parcel shared by several growth properties (25 parcels, three properties each)
        appears once per property with the same polygon, and clip 5167985792 appears once
        per parcel shape.
      examples:
        - |
          Q: How many properties in each census tract are in a growth stage?
          Notes: growth_indicators has one row per property and carries tract_geoid, so no join and no DISTINCT are needed. Seven tracts are returned, from 364 properties (12071050318) down to 2 (12071050316); tract 12071050315 has no growth property, so it is absent from the result rather than zero.
          SQL: SELECT tract_geoid, COUNT(*) AS growth_properties FROM `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_growth_study` GROUP BY tract_geoid ORDER BY growth_properties DESC
        - |
          Q: Break down growth properties by stage and type in census tract 12071050318.
          Notes: Filter on g.tract_geoid - no join needed. TRIM type_of_growth because the multi-family value has a trailing space. Expect 10 stage/type rows; Ongoing Growth Vacant Land (113) and Recently Completed Vacant Land (125) are the largest.
          SQL: SELECT growth_stage, TRIM(type_of_growth) AS type_of_growth, COUNT(*) AS properties FROM `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_growth_study` WHERE tract_geoid = '12071050318' GROUP BY 1, 2 ORDER BY 1, 3 DESC
        - |
          Q: Show the Ongoing Growth parcels in census tract 12071050318 on the map.
          Notes: The polygon comes from parcel_essentials; filter the tract on g.tract_geoid (one tract per property). Returns 120 rows - 120 properties on 120 parcels. A parcel shared by several growth properties would appear once per property with the same polygon.
          SQL: SELECT p.parcel_shape_id, g.clip, g.growth_stage, TRIM(g.type_of_growth) AS type_of_growth, g.recent_new_con_bldg_permit_effective_date, p.situs_street_address, p.parcel_geometry_wkt FROM `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_growth_study` g JOIN `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_essentials_study` p ON p.clip = g.clip WHERE g.growth_stage = 'Ongoing Growth' AND g.tract_geoid = '12071050318'
        - |
          Q: Which builder/developer-owned properties had a new construction building permit in the last two years? Show the owner and address.
          Notes: Both flags are on growth_indicators; the owner name and address come from parcel_essentials and are property (CLIP)-grain, so SELECT DISTINCT without the geometry gives one row per property. Returns 8 properties, all Ongoing Growth, 5 of them owned by PULTE HOME COMPANY LLC; permit dates run from 20241121 to 20260922.
          SQL: SELECT DISTINCT g.clip, p.ownr1fullname, p.situs_street_address, p.situs_city, g.growth_stage, g.recent_new_con_bldg_permit_effective_date FROM `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_growth_study` g JOIN `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_essentials_study` p ON p.clip = g.clip WHERE g.builder_developer_ownership_indicator = 'Y' AND g.recent_new_con_bldg_permit_indicator = 'Y' ORDER BY g.recent_new_con_bldg_permit_effective_date DESC
        - |
          Q: What is the average number of nearby new-construction properties by growth type in ZIP 34135?
          Notes: The ZIP comes from parcel_essentials (situs_zip_code mixes 5-digit ZIPs and ZIP+4, so match with LIKE). Nearby counts overlap between neighbours, so average them (never SUM) on one row per clip - the inner SELECT DISTINCT collapses the join. The count is populated only on properties with a recent new construction sale, so report how many properties carry it: 795 growth properties in the ZIP, 204 with a count (Vacant Land 141 of 443, average 162.7; Single Family Residential 32 of 218, average 189.9; Multi-Family 31 of 121, average 118.8); Commercial and Other have none.
          SQL: SELECT TRIM(type_of_growth) AS type_of_growth, COUNT(*) AS properties, COUNT(nearby) AS properties_with_count, ROUND(AVG(nearby), 1) AS avg_nearby_new_construction, MAX(nearby) AS max_nearby_new_construction FROM (SELECT DISTINCT g.clip, g.type_of_growth, g.recent_nearby_new_construction_cnt AS nearby FROM `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_growth_study` g JOIN `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_essentials_study` p ON p.clip = g.clip WHERE p.situs_zip_code LIKE '34135%') t GROUP BY 1 ORDER BY 2 DESC
        - |
          Q: What share of properties in each census tract is in a growth stage?
          Notes: growth_indicators holds only properties in a growth stage, so the denominator is COUNT(DISTINCT p.clip) from parcel_essentials with a LEFT JOIN to growth. Shares run from 0% (12071050315) to 9.8% (12071050401, 287 of 2,925). Grouping on p.tract_geoid counts each of the 2 properties that straddle two tracts in both of them (one is a growth property), so the columns sum to 21,449 and 919, and 12071050401 shows one more growth property than its g.tract_geoid count of 286.
          SQL: SELECT p.tract_geoid, COUNT(DISTINCT p.clip) AS properties, COUNT(DISTINCT g.clip) AS growth_properties, ROUND(100 * COUNT(DISTINCT g.clip) / COUNT(DISTINCT p.clip), 1) AS pct_in_growth FROM `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_essentials_study` p LEFT JOIN `clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_growth_study` g ON g.clip = p.clip GROUP BY 1 ORDER BY 1

    datasets:
      - name: growth_indicators
        source: "clgx-gis-app-dev-06e3.work_eprashar.carto_sdsc_growth_study"
        primary_key: [clip]
        ai_context:
          instructions: >
            GRAIN: one row per property in a growth stage - 918 rows; clip (the CLIP, a 10-digit
            STRING; puid in the production view) is unique and never NULL. Every row has a
            growth_stage, so properties with no growth activity are not in this table - "share of
            all properties" questions need parcel_essentials as the denominator. tract_geoid is
            the only location column.

            SNAPSHOT: the rows are the production growth release built 2026-10-11 for this area,
            unchanged, and the table is not refreshed. "Recent" and "past two years" are relative
            to that release, not to today.

            GROWTH STAGE: growth_stage is 'Early Growth', 'Ongoing Growth' or 'Recently Completed'
            (not 'Recently Completed Growth'). Verified 2026-10-14: every Ongoing Growth row has
            recent_new_con_bldg_permit_indicator = 'Y' and no new-construction sale or recent year
            built; Early Growth rows have none of those three, and each has at least one of
            landuse_change_indicator, builder_developer_ownership_indicator or new_clip_indicator
            = 'Y'; the new-construction sale and recent year built flags occur only on Recently
            Completed rows, and every Recently Completed row has at least one of them.

            TYPE OF GROWTH: compare with TRIM(type_of_growth) - the multi-family value is stored as
            'Multi-Family ' with a trailing space.

            FLAGS: the Y/N indicators use different encodings. recent_new_construction_sale_indicator
            is 'Y' or NULL only; recent_yearbuilt_indicator is always 'Y' or 'N'; the others are 'Y',
            'N' or NULL. NULL means not indicated, so for the negative case use
            COALESCE(<flag>, 'N') = 'N' and say "not indicated" rather than "no".

            RECENT WINDOW: "recent" means the past two years. Permit effective dates run from
            20241016 to 20260922 in this table, and year_built is 2024 wherever it is populated.
            Dates are YYYYMMDD integers:
            PARSE_DATE('%Y%m%d', CAST(recent_new_con_bldg_permit_effective_date AS STRING)).

            NEARBY COUNTS: the *_cnt columns count OTHER properties within two miles that carry the
            flag. They were computed on the full production data, so they include neighbours that
            are not in this table or the study area and cannot be reproduced by counting rows
            here. They describe the neighbourhood, overlap between neighbours, and must never be
            summed across properties - use AVG or MAX on one row per clip. NULL means not
            computed, not zero; each field says where it is populated.

            UNPOPULATED COLUMNS: anticipated_early_growth_score, anticipated_construction_score,
            anticipated_construction_completed_score, pre_growth_stage_indicator,
            ownership_classification, builder_developer_type_code, date_of_last_growth_stage_change and
            parcel_link_status are NULL on every row of this table (verified 2026-10-14). Never
            filter or group on them; if asked, say the field is not populated.

            UNDOCUMENTED COLUMNS: addr_vacant_ratio, count_year_built and count_eff_year_built are not
            in the product data dictionary; say their meaning is unconfirmed if you use them.

        fields:
          # --- Identification ---

          - name: clip
            label: "Identification"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: clip
            description: "Property identifier: the Cotality CLIP as a 10-digit string. Named puid (INT64) in the production view; renamed and converted to STRING for this table, with no leading zeros lost (every value is 10 digits, as in parcel_essentials). Unique and never NULL - one row per property, 918 rows. Join to parcel_essentials with p.clip = g.clip (no CAST); all 918 match a parcel_essentials clip (verified 2026-10-14), and one of them (5167985792) spans two parcel shapes."
            ai_context:
              synonyms:
                - "puid"
                - "cotality property id"
                - "growth property id"
              instructions: "BigQuery type: STRING. Identifier column (primary key)."

          - name: tract_geoid
            label: "Identification"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: tract_geoid
            description: "Full 11-digit 2020 Census tract GEOID of the property (2-digit state + 3-digit county + 6-digit tract), e.g. '12071050318'. Added to this study extract; not in the production growth view. Never NULL; one value per property. Seven of the eight study tracts occur - '12071050318' (364 rows), '12071050401' (286), '12071050601' (110), '12071050317' (66), '12071050603' (61), '12071050502' (29), '12071050316' (2); '12071050315' has no growth property. Agrees with parcel_essentials tract_geoid for all 918 properties; clip 5167985792, whose two parcel shapes lie in tracts 12071050401 and 12071050502, holds '12071050502'. Use it for tract filters and per-tract counts without the join."
            ai_context:
              synonyms:
                - "growth property tract"
                - "growth tract"
              instructions: "BigQuery type: STRING. Common filter column."

          - name: property_linkage_id
            label: "Identification"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: propertylinkageid
            description: "Internal property linkage key. Unique in this table (918 values, never NULL), but it is not a CLIP and matches no parcel_essentials key - never use it for joins."
            ai_context:
              instructions: "BigQuery type: INT64."

          # --- Growth Indicators ---

          - name: recent_new_construction_sale_indicator
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: recent_new_construction_sale_indicator
            description: "Most recent sale was within the past two years and identified as a new construction sale. Only 'Y' or NULL occur - there is no 'N' value, so use IS NULL (stated as 'not indicated') for the negative case."
            ai_context:
              synonyms:
                - "new construction sale"
              instructions: "BigQuery type: STRING. Flag column. Values (2026-10-14): yes: 'Y' (204 rows); not indicated: NULL (714 rows)."

          - name: recent_nearby_new_construction_count
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: recent_nearby_new_construction_cnt
            description: "Count of other properties within two miles with the New Construction Property Indicator set to Y."
            ai_context:
              synonyms:
                - "nearby new construction"
              instructions: "BigQuery type: INT64. Numeric measure, unit: count. Neighbourhood count of OTHER properties within two miles; never SUM it across properties (the radii overlap) - use AVG or MAX on one row per clip. NULL means not computed, not zero. Populated on 204 rows - exactly the rows with recent_new_construction_sale_indicator = 'Y' - from 55 to 207 (median 165); computed on the full production data, so it counts neighbours outside this table."

          - name: land_use_change_indicator
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: landuse_change_indicator
            description: "Land use for the property has changed in the past two years."
            ai_context:
              synonyms:
                - "land use change"
              instructions: "BigQuery type: STRING. Flag column. Values (2026-10-14): yes: 'Y' (131 rows); no: 'N' (161 rows); not indicated: NULL (626 rows)."

          - name: land_use_change_indicator_count
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: landuse_change_cnt
            description: "Count of other properties within two miles with the Land Use Change Indicator set to Y."
            ai_context:
              synonyms:
                - "nearby land use change"
              instructions: "BigQuery type: INT64. Numeric measure, unit: count. Neighbourhood count of OTHER properties within two miles; never SUM it across properties (the radii overlap) - use AVG or MAX on one row per clip. NULL means not computed, not zero. Populated on 292 rows - exactly where land_use_change_indicator is 'Y' or 'N' - from 516 to 1,431 (median 1,140); computed on the full production data, so it counts neighbours outside this table (only 131 rows here have the flag)."

          - name: previous_land_use_code
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: previous_land_use_code
            description: "Previous Cotality land use code (the same 3-digit code set as parcel_essentials land_use_code / IrisLandUseCd). Populated whenever land_use_change_indicator is 'Y' or 'N' (also on the 'N' rows) and NULL otherwise; compare it with p.IrisLandUseCd to show the old and current land use."
            ai_context:
              synonyms:
                - "previous land use"
                - "prior land use"
              instructions: "BigQuery type: STRING. Code column; 13 distinct codes in this table, populated on 292 rows. Counts: '465' (111 rows), '100' (105), '460' (20), '415' (15), '420' (12), '435' (4), '132', '137', '163' and '200' (5 each), '400' (3), '515' and '601' (1 each). Bands as in parcel_essentials land_use_code: 100-199 residential, 200-299 commercial, 300-399 industrial, 400-499 vacant land."

          - name: builder_developer_ownership_indicator
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: builder_developer_ownership_indicator
            description: "Set to Y if the owner is identified as a builder or a developer."
            ai_context:
              synonyms:
                - "builder owned"
                - "developer owned"
              instructions: "BigQuery type: STRING. Flag column. Values (2026-10-14): yes: 'Y' (61 rows); no: 'N' (2 rows); not indicated: NULL (855 rows)."

          - name: builder_developer_type_code
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: builder_developer_type_code
            description: "Categorizes builder/developer type (multi-family, single family, commercial). Reserved for future use."
            ai_context:
              instructions: "BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter or group on it."

          - name: new_clip_indicator
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: new_clip_indicator
            description: "Indicates that the property received a CLIP in the past two years."
            ai_context:
              synonyms:
                - "new clip"
                - "new parcel"
              instructions: "BigQuery type: STRING. Flag column. Values (2026-10-14): yes: 'Y' (386 rows); no: 'N' (138 rows); not indicated: NULL (394 rows)."

          - name: new_clip_count
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: new_clip_cnt
            description: "Count of other properties within two miles with the New CLIP Indicator set to Y."
            ai_context:
              synonyms:
                - "nearby new clips"
              instructions: "BigQuery type: INT64. Numeric measure, unit: count. Neighbourhood count of OTHER properties within two miles; never SUM it across properties (the radii overlap) - use AVG or MAX on one row per clip. NULL means not computed, not zero. Populated on 524 rows - exactly where new_clip_indicator is 'Y' or 'N' - from 13 to 535 (median 453); computed on the full production data, so it counts neighbours outside this table."

          - name: recent_year_built_indicator
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: recent_yearbuilt_indicator
            description: "Indicates that the Year Built is less than three years ago. Always 'Y' or 'N', never NULL."
            ai_context:
              synonyms:
                - "recently built"
                - "new build"
              instructions: "BigQuery type: STRING. Flag column. Values (2026-10-14): yes: 'Y' (244 rows); no: 'N' (674 rows)."

          - name: recent_year_built_count
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: recent_yearbuilt_cnt
            description: "Count of other properties within two miles with the Recent Year Built Indicator set to Y."
            ai_context:
              synonyms:
                - "nearby recently built"
              instructions: "BigQuery type: INT64. Numeric measure, unit: count. Neighbourhood count of OTHER properties within two miles; never SUM it across properties (the radii overlap) - use AVG or MAX on one row per clip. NULL means not computed, not zero. Populated on 244 rows - exactly the rows with recent_year_built_indicator = 'Y' (NULL on the 'N' rows) - from 34 to 235 (median 227); computed on the full production data, so it counts neighbours outside this table."

          - name: recent_new_construction_building_permit_indicator
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: recent_new_con_bldg_permit_indicator
            description: "A new construction building permit was issued for the property in the past two years."
            ai_context:
              synonyms:
                - "building permit"
                - "new construction permit"
              instructions: "BigQuery type: STRING. Flag column. Values (2026-10-14): yes: 'Y' (366 rows); no: 'N' (71 rows); not indicated: NULL (481 rows)."

          - name: new_construction_building_permit_effective_date
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: recent_new_con_bldg_permit_effective_date
            description: "Effective date of the new construction building permit as a YYYYMMDD integer. Populated whenever the permit indicator is 'Y' or 'N' (437 rows - the 'N' rows carry a date too) and NULL otherwise; 20241016-20260922 in this table (2024: 106 rows, 2025: 269, 2026: 62). Convert with PARSE_DATE('%Y%m%d', CAST(recent_new_con_bldg_permit_effective_date AS STRING))."
            ai_context:
              synonyms:
                - "permit date"
              instructions: "BigQuery type: INT64. Date stored as an integer."

          - name: recent_new_construction_building_permit_count
            label: "Growth Indicators"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: recent_new_con_bldg_permit_cnt
            description: "Count of other properties within two miles with the Recent New Construction Building Permit Indicator set to Y."
            ai_context:
              synonyms:
                - "nearby permits"
              instructions: "BigQuery type: INT64. Numeric measure, unit: count. Neighbourhood count of OTHER properties within two miles; never SUM it across properties (the radii overlap) - use AVG or MAX on one row per clip. NULL means not computed, not zero. Populated on 437 rows - exactly where the permit indicator is 'Y' or 'N' - from 115 to 460 (median 356); computed on the full production data, so it counts neighbours outside this table. Values are from the release this table was cut from; the live production view has since raised them by 0-3 on most rows."

          # --- Stage and Type of Growth ---

          - name: type_of_growth
            label: "Stage and Type of Growth"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: type_of_growth
            description: "Categorizes current land use into broader growth types. Never NULL. The multi-family value carries a trailing space ('Multi-Family '), so compare with TRIM(type_of_growth) = 'Multi-Family' and select TRIM(type_of_growth) for display."
            ai_context:
              synonyms:
                - "growth type"
                - "development type"
              instructions: "BigQuery type: STRING. Values (2026-10-14): 'Vacant Land' (471 rows), 'Single Family Residential' (247), 'Multi-Family ' with a trailing space (122), 'Commercial' (66), 'Other' (12). The production values 'Agricultural' and 'Transient Residential' do not occur in this table."

          - name: stage_of_growth
            label: "Stage and Type of Growth"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: growth_stage
            description: "Lifecycle stage of the property. Never NULL. Early Growth = evidence of land use change, builder/developer ownership or a new CLIP; Ongoing Growth = a recent new construction building permit; Recently Completed = a recent new construction sale or a recent year built. The value is 'Recently Completed', not 'Recently Completed Growth'."
            ai_context:
              synonyms:
                - "growth stage"
                - "development stage"
              instructions: "BigQuery type: STRING. Values (2026-10-14): 'Recently Completed' (393 rows), 'Early Growth' (307), 'Ongoing Growth' (218)."

          - name: date_of_last_growth_stage_change
            label: "Stage and Type of Growth"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: date_of_last_growth_stage_change
            description: "Date when the current growth stage first occurred, as a YYYYMMDD number."
            ai_context:
              instructions: "BigQuery type: NUMERIC. NULL on every row of this table (verified 2026-10-14) - do not filter or group on it."

          - name: ownership_classification
            label: "Stage and Type of Growth"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: ownership_classification
            description: "Classifies property ownership into categories (e.g. Private, Builder, Developer, Investor, Government)."
            ai_context:
              instructions: "BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter or group on it."

          # --- Growth Stage Confidence Model ---

          - name: anticipated_early_growth_score
            label: "Growth Stage Confidence Model"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: anticipated_early_growth_score
            description: "Predicts if and when a parcel will begin its Early Growth stage from a non-growth state. Scores 1-5, 5 highest."
            ai_context:
              instructions: "BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter or group on it."

          - name: anticipated_construction_score
            label: "Growth Stage Confidence Model"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: anticipated_construction_score
            description: "Predicts if and when a parcel will begin construction (Ongoing Growth) from Early Growth. Scores 1-5, 5 highest."
            ai_context:
              instructions: "BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter or group on it."

          - name: anticipated_construction_completed_score
            label: "Growth Stage Confidence Model"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: anticipated_construction_completed_score
            description: "Predicts if and when a parcel will enter its Completed Property stage from Ongoing Growth. Scores 1-5, 5 highest."
            ai_context:
              instructions: "BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter or group on it."

          - name: pre_growth_stage_indicator
            label: "Growth Stage Confidence Model"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: pre_growth_stage_indicator
            description: "1 if anticipated_early_growth_score has a value (pre-growth potential), else 0."
            ai_context:
              instructions: "BigQuery type: STRING. NULL on every row of this table (verified 2026-10-14) - do not filter or group on it."

          # --- Property Context ---

          - name: address_count
            label: "Property Context"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: mailing_address_count
            description: "Count of unique addresses associated with the property. 1-353 (median 1); NULL on 64 rows."
            ai_context:
              synonyms:
                - "number of addresses"
              instructions: "BigQuery type: INT64. Numeric measure, unit: count."

          - name: year_built
            label: "Property Context"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: year_built
            description: "Year of construction. Populated exactly when recent_year_built_indicator = 'Y' (244 rows, every one 2024) and NULL otherwise - it is not a general year-built field, and the parcel_essentials fields in this model have none."
            ai_context:
              synonyms:
                - "year built"
                - "construction year"
              instructions: "BigQuery type: INT64. Unit: year. Do not SUM."

          - name: address_vacant_ratio
            label: "Property Context"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: addr_vacant_ratio
            description: "Not in the product data dictionary. 0 on every populated row of this table (560 rows) and NULL on the other 358; the name suggests the share of the property's addresses flagged vacant. Say it is unconfirmed if you use it."
            ai_context:
              instructions: "BigQuery type: FLOAT64. Do not SUM."

          - name: count_year_built
            label: "Property Context"
            expression:
